# Development layout compatible with the existing skeleton's bench scripts, but using the pinned production build.
# The app mount makes Python edits visible without rebuilding upstream Frappe/ERPNext assets.
name: capxul-skeleton
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: capxul
      POSTGRES_USER: capxul_admin
      POSTGRES_PASSWORD: capxul-local-admin # public development fixture, never use outside this orb
    ports: ["127.0.0.1:5432:5432"]
    volumes: [orb-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U capxul_admin -d capxul]
      interval: 3s
      retries: 40
  mariadb:
    image: mariadb:11.8
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    environment:
      MARIADB_ROOT_PASSWORD: "123" # public local fixture required by the skeleton site scripts; never published
    volumes: [orb-db:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      retries: 20
  bench:
    image: capxul-bench:orb
    pull_policy: never
    working_dir: /home/frappe/frappe-bench
    command: [bash, /orb/start-bench.sh]
    depends_on:
      mariadb: {condition: service_healthy}
      redis: {condition: service_healthy}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:9000:9000"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - orb-sites:/home/frappe/frappe-bench/sites
      - orb-logs:/home/frappe/frappe-bench/logs
      - ../../frappe-app:/home/frappe/frappe-bench/apps/capxul:ro
      - ./start-bench.sh:/orb/start-bench.sh:ro
volumes:
  orb-postgres:
  orb-db:
  orb-sites:
  orb-logs:
