{
  // Gate 11 for Payments (docs/planning/protocol-v4/fv/certora.md, "Payments.spec"; invariants P1-P8).
  // Three token harnesses are linked and every token call is DISPATCHER(true) to them: a standard ERC-20,
  // a fee-on-transfer one and one that re-enters Payments. Run from packages/contracts/v4.
  "files": [
    "src/money/Payments.sol",
    "certora/harnesses/PaymentsDummyERC20.sol",
    "certora/harnesses/PaymentsFeeTokenHarness.sol",
    "certora/harnesses/PaymentsReentrantTokenHarness.sol"
  ],
  "verify": "Payments:certora/specs/Payments.spec",
  "link": ["PaymentsReentrantTokenHarness:payments=Payments"],
  "solc": "solc8.28",
  "packages": ["@openzeppelin/contracts=../node_modules/@openzeppelin/contracts"],
  // sendBatch loops over its items; P6_batchAllOrNothing fixes two items, so three unrollings are exact.
  "optimistic_loop": false,
  "loop_iter": "3",
  "smt_timeout": "300",
  "rule_sanity": "basic",
  "msg": "Payments P1-P8"
}
