{
  // Gate 11 for Options (docs/planning/protocol-v4/fv/certora.md, "Vesting.spec and Options.spec"; invariants
  // O1, O2, H4, H5). The Captable, Payments, the strike token and Hats are summarised in the spec, and the
  // Calendar's month count by a monotone ghost (CalendarSummaries.spec axioms, proved by the exhaustive loops),
  // so no second contract is linked. Run from packages/contracts/v4.
  "files": ["certora/harnesses/OptionsHarness.sol"],
  "verify": "OptionsHarness:certora/specs/Options.spec",
  "solc": "solc8.28",
  "packages": [
    "@openzeppelin/contracts=../node_modules/@openzeppelin/contracts"
  ],
  // No loop: endAllForExit is O(1) (an exit time that getGrant, vestedOf, exercise and lapse read; plans/Options.md),
  // so no rule depends on the grant count. loop_iter stays a check, never an optimistic assumption.
  "optimistic_loop": false,
  "loop_iter": "3",
  "smt_timeout": "300",
  "rule_sanity": "basic",
  "msg": "Options O1 O2 H4 H5"
}
