{
  // Gate 11 for the Captable (docs/planning/protocol-v4/fv/certora.md, "Captable.spec and ShareClass.spec").
  // Each class token is a clone the Captable creates, so no instance is linked (fv/certora.md: never rely on
  // dynamic_bound for clones). The spec summarises every ShareClass call against per-token ghosts (the
  // "linked ShareClass" of invariants.md E1/E2), and Vesting, the Governors and a custom rule likewise.
  // Run from packages/contracts/v4.
  "files": ["certora/harnesses/CaptableHarness.sol"],
  "verify": "CaptableHarness:certora/specs/Captable.spec",
  "solc": "solc8.28",
  "packages": [
    "@openzeppelin/contracts=../node_modules/@openzeppelin/contracts",
    "@openzeppelin/contracts-upgradeable=../node_modules/@openzeppelin/contracts-upgradeable"
  ],
  // Loops are over at most 32 classes (constant bound): unrolling is exact, never optimistic.
  "optimistic_loop": false,
  "loop_iter": "33",
  "smt_timeout": "300",
  "rule_sanity": "basic",
  "msg": "Captable E1 E2 E4 E7 E8 E10 E11 H4 H5"
}
