<title>Rebuild Sitrep</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: a phone app (large titles, inset grouped lists, five tabs, a mini player) that becomes sidebar, list and
   detail panel on a laptop. Every value below comes from these tokens; nothing else is used. */
:root {
  /* Colour: cool neutrals biased to the accent, one accent, and state colours used only for state. */
  --bg: #f2f3f7;
  --surface: #ffffff;
  --fill: #e9ebf1;
  --fill-strong: #dcdfe8;
  --line: rgba(22, 28, 48, 0.1);
  --ink: #12151d;
  --ink-2: #4d5466;
  --ink-3: #7c8396;
  --accent: #3150e0;
  --accent-ink: #ffffff;
  --accent-soft: rgba(49, 80, 224, 0.1);
  --good: #13843b;
  --good-soft: rgba(19, 132, 59, 0.11);
  --warn: #9a5b00;
  --warn-soft: rgba(214, 140, 0, 0.14);
  --bad: #c9302c;
  --bad-soft: rgba(201, 48, 44, 0.1);
  --chart-1: #2a78d6;
  --chart-ref: #7c8396;
  --grid: #e3e5ec;
  --shadow: 0 1px 2px rgba(18, 21, 29, 0.06), 0 8px 24px rgba(18, 21, 29, 0.06);
  --scrim: rgba(18, 21, 29, 0.28);
  --glass: rgba(242, 243, 247, 0.82);
  --toast: #1c2030;
  --toast-ink: #f3f4f8;

  /* Type: five sizes, three faces. */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Inter Tight", "Inter", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --t1: 12px;
  --t2: 14px;
  --t3: 16px;
  --t4: 20px;
  --t5: 30px;

  /* Space: a 4-pixel scale. Radii: two. Motion: under 250 ms. */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s8: 32px;
  --s10: 40px;
  --s12: 48px;
  --r-s: 8px;
  --r-l: 14px;
  --fast: 160ms;
  --slow: 240ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --tabbar: 56px;
  --icon-stroke: 1.75;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e13;
    --surface: #171a22;
    --fill: #222632;
    --fill-strong: #2d3240;
    --line: rgba(220, 226, 255, 0.1);
    --ink: #eef0f6;
    --ink-2: #b4bacb;
    --ink-3: #868da0;
    --accent: #7b91ff;
    --accent-ink: #0c0e13;
    --accent-soft: rgba(123, 145, 255, 0.16);
    --good: #41c46f;
    --good-soft: rgba(65, 196, 111, 0.14);
    --warn: #f0b13a;
    --warn-soft: rgba(240, 177, 58, 0.15);
    --bad: #ff6b66;
    --bad-soft: rgba(255, 107, 102, 0.14);
    --chart-1: #3987e5;
    --chart-ref: #868da0;
    --grid: #262a35;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    --scrim: rgba(0, 0, 0, 0.5);
    --glass: rgba(12, 14, 19, 0.82);
    --toast: #eef0f6;
    --toast-ink: #12151d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e13;
  --surface: #171a22;
  --fill: #222632;
  --fill-strong: #2d3240;
  --line: rgba(220, 226, 255, 0.1);
  --ink: #eef0f6;
  --ink-2: #b4bacb;
  --ink-3: #868da0;
  --accent: #7b91ff;
  --accent-ink: #0c0e13;
  --accent-soft: rgba(123, 145, 255, 0.16);
  --good: #41c46f;
  --good-soft: rgba(65, 196, 111, 0.14);
  --warn: #f0b13a;
  --warn-soft: rgba(240, 177, 58, 0.15);
  --bad: #ff6b66;
  --bad-soft: rgba(255, 107, 102, 0.14);
  --chart-1: #3987e5;
  --chart-ref: #868da0;
  --grid: #262a35;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  --scrim: rgba(0, 0, 0, 0.5);
  --glass: rgba(12, 14, 19, 0.82);
  --toast: #eef0f6;
  --toast-ink: #12151d;
  color-scheme: dark;
}

/* Base */
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--t3)/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
* { box-sizing: border-box; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
a { color: var(--accent); text-decoration: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-s); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: var(--t1); letter-spacing: 0; }
.muted { color: var(--ink-3); }
.ink2 { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: var(--icon-stroke); stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 16px; height: 16px; }
svg.i.fill { fill: currentColor; stroke: none; }

/* App frame */
#app { height: 100%; }
.app { position: relative; height: 100%; display: flex; }
.main { position: relative; flex: 1; min-width: 0; height: 100%; overflow: hidden; }
.page {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; background: var(--bg);
  overscroll-behavior: contain; scroll-padding-bottom: calc(var(--tabbar) + 96px);
}
.page.pushed { box-shadow: -8px 0 24px rgba(0, 0, 0, 0.08); }
.page.enter { animation: push-in var(--slow) var(--ease); }
.page.under { transform: translateX(-24%); transition: transform var(--slow) var(--ease); }
@keyframes push-in { from { transform: translateX(100%); } to { transform: none; } }
.content {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar) + 120px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: var(--s6);
}

/* Navigation bar with a large title that shrinks into it on scroll */
.navbar {
  position: sticky; top: 0; z-index: 5; height: 48px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: transparent; border-bottom: 1px solid transparent;
  transition: background var(--fast), border-color var(--fast);
}
.scrolled .navbar { background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom-color: var(--line); }
.navbar .small-title {
  font-weight: 600; font-size: var(--t3); opacity: 0; transform: translateY(4px);
  transition: opacity var(--fast), transform var(--fast); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 56vw;
}
.scrolled .navbar .small-title { opacity: 1; transform: none; }
.navbar .end { justify-self: end; display: flex; gap: var(--s1); }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); font-size: var(--t3); padding: var(--s2); min-height: 44px; }
.icon-btn { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--r-s); color: var(--ink-2); }
.icon-btn:hover { background: var(--fill); }
.large { display: flex; flex-direction: column; gap: var(--s1); padding-top: var(--s1); }
.large h1 {
  margin: 0; font: 700 var(--t5)/1.15 var(--font-display); letter-spacing: -0.02em; text-wrap: balance;
  transform-origin: left bottom; transition: opacity var(--fast);
}
.scrolled .large h1 { opacity: 0; }
.large .sub { color: var(--ink-3); font-size: var(--t2); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; }
.eyebrow { font: 600 var(--t1)/1.3 var(--font); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }

/* Sections and inset grouped lists */
.section { display: flex; flex-direction: column; gap: var(--s2); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); padding: 0 var(--s1); }
.section-head h2 { margin: 0; font: 700 var(--t4)/1.25 var(--font-display); letter-spacing: -0.01em; }
.section-head h2 .count { color: var(--ink-3); font-weight: 600; margin-left: var(--s1); }
.section-foot { padding: 0 var(--s1); font-size: var(--t1); color: var(--ink-3); display: flex; gap: var(--s1); align-items: center; }
.section-foot.stale { color: var(--warn); }
.group { background: var(--surface); border-radius: var(--r-l); overflow: hidden; }
.row {
  position: relative; display: flex; align-items: center; gap: var(--s3); width: 100%;
  padding: var(--s3) var(--s4); min-height: 52px; color: var(--ink);
}
.row + .row::before { content: ""; position: absolute; top: 0; left: var(--s4); right: 0; border-top: 1px solid var(--line); }
.row.indent + .row.indent::before { left: 60px; }
button.row:hover, a.row:hover { background: var(--fill); }
button.row:active, a.row:active { background: var(--fill-strong); }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .title { font-weight: 500; overflow-wrap: anywhere; }
.row .meta { font-size: var(--t2); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; }
.row .end { display: flex; align-items: center; gap: var(--s2); color: var(--ink-3); font-size: var(--t2); flex: none; }
.row .chev { color: var(--ink-3); opacity: 0.7; }
.row.dim .title, .row.dim .meta { color: var(--ink-3); }
.lead-icon { width: 32px; height: 32px; flex: none; border-radius: var(--r-s); display: grid; place-items: center; background: var(--fill); color: var(--ink-2); font-size: var(--t3); }
.lead-icon.accent { background: var(--accent-soft); color: var(--accent); }
.lead-icon.good { background: var(--good-soft); color: var(--good); }
.lead-icon.warn { background: var(--warn-soft); color: var(--warn); }
.lead-icon.bad { background: var(--bad-soft); color: var(--bad); }

/* Chips: one shape, colour only for state */
.chip {
  display: inline-flex; align-items: center; gap: var(--s1); height: 22px; padding: 0 var(--s2);
  border-radius: var(--r-s); background: var(--fill); color: var(--ink-2);
  font: 600 var(--t1)/1 var(--font); white-space: nowrap;
}
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.dot-unheard { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }

/* Cards */
.card { background: var(--surface); border-radius: var(--r-l); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.prose { display: flex; flex-direction: column; gap: var(--s4); }
.prose .part { display: flex; flex-direction: column; gap: var(--s1); }
.prose p { margin: 0; color: var(--ink); max-width: 65ch; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--s2) var(--s4); font-size: var(--t2); }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 40px;
  padding: 0 var(--s4); border-radius: var(--r-s); font-weight: 600; font-size: var(--t2);
  background: var(--fill); color: var(--ink);
}
.btn:hover { background: var(--fill-strong); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; color: var(--accent); padding: 0 var(--s2); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* Folds */
.fold-head { display: flex; align-items: center; gap: var(--s2); width: 100%; min-height: 44px; padding: var(--s2) var(--s1); color: var(--ink-2); font-weight: 600; font-size: var(--t2); }
.fold-head .chev { transition: transform var(--fast) var(--ease); }
.fold-head[aria-expanded="true"] .chev { transform: rotate(90deg); }
.fold-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--slow) var(--ease); }
.fold-body > div { overflow: hidden; min-height: 0; }
.fold-body.open { grid-template-rows: 1fr; }

/* Ask cards */
.ask { background: var(--surface); border-radius: var(--r-l); padding: var(--s4); display: flex; flex-direction: column; gap: var(--s3); box-shadow: var(--shadow); }
.ask-who { display: flex; align-items: center; gap: var(--s3); font-size: var(--t2); }
.ask-who .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; flex: none; }
.ask-who .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ask-who .who b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ask h3 { margin: 0; font: 600 var(--t4)/1.3 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.options { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; }
.option { position: relative; display: flex; gap: var(--s3); align-items: flex-start; padding: var(--s3); width: 100%; }
.option + .option { border-top: 1px solid var(--line); }
.option:hover { background: var(--fill); }
.option .letter {
  width: 28px; height: 28px; border-radius: var(--r-s); flex: none; display: grid; place-items: center;
  background: var(--fill); color: var(--ink-2); font: 600 var(--t2)/1 var(--font-mono);
}
.option.recommended .letter { background: var(--accent-soft); color: var(--accent); }
.option .o-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.option .o-title { font-weight: 600; display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; }
.option .o-detail { font-size: var(--t2); color: var(--ink-2); }
.own { display: flex; flex-direction: column; gap: var(--s2); padding: 0 var(--s3) var(--s3); }
.own textarea {
  width: 100%; min-height: 96px; resize: vertical; padding: var(--s3); border-radius: var(--r-s);
  border: 1px solid var(--line); background: var(--bg); font-size: var(--t3);
}
.own textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.details { display: flex; flex-direction: column; gap: var(--s4); padding: var(--s1) var(--s1) var(--s2); }
.details h4 { margin: 0 0 var(--s1); }
.details ul { margin: 0; padding-left: var(--s5); display: flex; flex-direction: column; gap: var(--s1); }
.answered { display: flex; gap: var(--s3); align-items: flex-start; }
.answered .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ask.resolved { animation: resolve var(--slow) var(--ease); box-shadow: none; }
@keyframes resolve { from { transform: scale(0.98); opacity: 0.6; } to { transform: none; opacity: 1; } }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s2); padding: var(--s8) var(--s6); }
.empty .badge { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--good-soft); color: var(--good); }
.empty h3 { margin: 0; font: 600 var(--t4)/1.3 var(--font-display); }
.empty p { margin: 0; color: var(--ink-3); font-size: var(--t2); max-width: 36ch; }

/* Progress */
.bar { height: 6px; border-radius: 3px; background: var(--fill-strong); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.good > i { background: var(--good); }
.ring { --p: 0; width: 32px; height: 32px; border-radius: 50%; flex: none;
  background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--fill-strong) 0); display: grid; place-items: center; }
.ring::after { content: ""; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); }
.ring.done { background: var(--good); }
.ring.done::after { display: none; }

/* History */
.history { display: flex; flex-direction: column; }
.h-item { position: relative; display: grid; grid-template-columns: 28px 1fr; gap: var(--s3); padding: var(--s3) var(--s4); }
.h-item::before { content: ""; position: absolute; left: calc(var(--s4) + 13px); top: 40px; bottom: -4px; width: 2px; background: var(--fill-strong); }
.h-item:last-child::before { display: none; }
.h-icon { width: 28px; height: 28px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; font-size: var(--t2); color: var(--ink-2); }
.h-icon.person { background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: var(--t1); }
.h-icon.pipeline { background: var(--good-soft); color: var(--good); }
.h-body { min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: var(--t2); }
.h-body .what { font-weight: 600; color: var(--ink); font-size: var(--t2); }
.h-body .quote { color: var(--ink-2); border-left: 2px solid var(--fill-strong); padding-left: var(--s2); }

/* Charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font: 500 11px var(--font); fill: var(--ink-3); }
.chart .tip {
  position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  border-radius: var(--r-s); padding: var(--s2) var(--s3); font-size: var(--t1); white-space: nowrap; transform: translate(-50%, calc(-100% - 12px));
}
.legend { display: flex; flex-wrap: wrap; gap: var(--s4); font-size: var(--t1); color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: var(--s1); }
.legend i { width: 14px; height: 0; border-top: 2px solid var(--chart-1); }
.legend i.ref { border-top: 2px dashed var(--chart-ref); }
.verdict { margin: 0; font: 600 var(--t3)/1.4 var(--font); text-wrap: balance; }
.verdict-sub { margin: 0; font-size: var(--t2); color: var(--ink-3); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s3); }
.trend { background: var(--surface); border-radius: var(--r-l); padding: var(--s4); display: grid; grid-template-columns: 1fr 120px; gap: var(--s1) var(--s3); align-items: end; }
.trend .name { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: var(--s2); color: var(--ink-2); font-size: var(--t2); font-weight: 500; }
.trend .big { font: 700 var(--t5)/1 var(--font-display); letter-spacing: -0.02em; }
.trend .what { font-size: var(--t2); font-weight: 600; }
.budget-bar { position: relative; height: 12px; border-radius: 6px; background: var(--fill-strong); }
.budget-bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--good); }
.budget-bar.over > i { background: var(--bad); }
.budget-bar .tick { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink-2); }
.budget-bar .tick.review { background: var(--bad); }
.budget-scale { position: relative; height: 16px; font-size: var(--t1); color: var(--ink-3); }
.budget-scale span { position: absolute; transform: translateX(-50%); white-space: nowrap; }

/* Sitreps */
.day-head { padding: 0 var(--s1); font: 600 var(--t2) var(--font); color: var(--ink-3); }
.sitrep-row .title { font-weight: 600; }
.sitrep-row.heard .title { font-weight: 500; color: var(--ink-3); }
.sitrep-row .progress { width: 64px; }
.sitrep-open { padding: 0 var(--s4) var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.part-btn { display: flex; gap: var(--s3); width: 100%; padding: var(--s2) var(--s3); border-radius: var(--r-s); text-align: left; }
.part-btn:hover { background: var(--fill); }
.part-btn .n { font: 600 var(--t1)/1.9 var(--font-mono); color: var(--ink-3); flex: none; width: 16px; }
.part-btn.playing { background: var(--accent-soft); }
.part-btn.playing .n { color: var(--accent); }
.note { display: flex; gap: var(--s2); align-items: flex-start; font-size: var(--t2); color: var(--ink-2); background: var(--fill); border-radius: var(--r-s); padding: var(--s3); }

/* Player */
.player {
  position: fixed; z-index: 20; left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px));
  bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + var(--s2));

  tab(id) { store.set((s) => ({ tab: id, stacks: s.tab === id ? { ...s.stacks, [id]: [] } : s.stacks })); },
  push(page) { store.set((s) => ({ stacks: { ...s.stacks, [s.tab]: [...s.stacks[s.tab], page] } })); },
  pop() { store.set((s) => ({ stacks: { ...s.stacks, [s.tab]: s.stacks[s.tab].slice(0, -1) } })); },
  top() { const st = store.s.stacks[store.s.tab]; return st[st.length - 1]; },
};

/* Aaron's events. */
const added = (thing, id) => store.s.added.filter((e) => e.thing === thing && e.id === id);
const historyOf = (thing, item) => [...item.history, ...added(thing, item.id)];
function stateOf(thing, item) {
  const mine = added(thing, item.id);
  return mine.length ? mine[mine.length - 1].state : item.state;
}
let toastTimer = null;
function toast(text, undo) {
  clearTimeout(toastTimer);
  store.set({ toast: { text, undo } });
  toastTimer = setTimeout(() => store.set({ toast: null }), 6000);
}
function addEvent(e) {
  const ev = { by: AARON, at: nowIso(), ...e };
  store.set((s) => ({ added: [...s.added, ev] }));
  return ev;
}
function removeEvent(ev) { store.set((s) => ({ added: s.added.filter((x) => x !== ev) })); }

function answerAsk(ask, answer) {
  const ev = addEvent({ thing: "ask", id: ask.id, event: "ask_answered", state: "answered", answer });
  const what = answer.chose ? "Answered " + answer.chose : "Answered in your own words";
  toast(what, () => { removeEvent(ev); store.set({ toast: null }); });
}
function markHeard(sitrep) {
  if (stateOf("sitrep", sitrep) === "heard") return;
  addEvent({ thing: "sitrep", id: sitrep.id, event: "sitrep_heard", state: "heard" });
  store.set((s) => ({ heardParts: { ...s.heardParts, [sitrep.id]: sitrep.fields.parts.length } }));
}
const openAsks = () => SNAP.needsYou.asks.map((id) => IX.asks[id]).filter((a) => a && stateOf("ask", a) === "open");

// ---- ui.js
// Shared pieces: a page with a large title that shrinks into the bar on scroll, sections, inset grouped rows, folds,
// and the history every plan, milestone, step, lane, ask and sitrep ends with.

/* A page. `back` is the label of the page underneath; a root page has none. */
function Page({ title, sub, back, end, children, cls, pageKey }) {
  const [scrolled, setScrolled] = useState(false);
  const [lifted, setLifted] = useState(false);
  const ref = useRef(null);
  useEffect(() => { if (ref.current) ref.current.scrollTop = 0; setScrolled(false); setLifted(false); }, [pageKey]);
  const onScroll = (e) => {
    const top = e.currentTarget.scrollTop;
    if (top > 36 !== scrolled) setScrolled(top > 36);
    if (top > 2 !== lifted) setLifted(top > 2);
  };
  return html`<section ref=${ref} class=${"page " + (cls || "") + (scrolled ? " scrolled" : "") + (lifted ? " lifted" : "")} onScroll=${onScroll} aria-label=${title}>
    <header class="navbar">
      <div>${back ? html`<button class="back" onClick=${() => nav.pop()} aria-label=${"Back to " + back}><${Icon} n="left" /><span>${back}</span></button>` : null}</div>
      <div class="small-title" aria-hidden="true">${title}</div>
      <div class="end">${end}</div>
    </header>
    <div class="content">
      <div class="large">
        <h1>${title}</h1>
        ${sub ? html`<div class="sub">${sub}</div>` : null}
      </div>
      ${children}
    </div>
  </section>`;
}

const Section = ({ title, count, foot, stale, children, id }) => html`<section class="section" aria-labelledby=${id}>
  ${title ? html`<div class="section-head"><h2 id=${id}>${title}${count != null ? html`<span class="count">${count}</span>` : null}</h2></div>` : null}
  ${children}
  ${foot ? html`<div class=${"section-foot" + (stale ? " stale" : "")}>${stale ? html`<${Icon} n="clock" sm />` : null}${foot}</div>` : null}
</section>`;

/* One row of an inset grouped list. A row with `onClick` is a button; with `href`, a link out. */
function Row({ lead, title, meta, end, onClick, href, dim, cls, label }) {
  const inner = html`${lead}
    <span class="body"><span class="title">${title}</span>${meta ? html`<span class="meta">${meta}</span>` : null}</span>
    ${end != null ? html`<span class="end">${end}</span>` : null}
    ${onClick ? html`<span class="chev"><${Icon} n="right" sm /></span>` : href ? html`<span class="chev"><${Icon} n="link" sm /></span>` : null}`;
  const c = "row" + (dim ? " dim" : "") + (cls ? " " + cls : "");
  if (onClick) return html`<button class=${c} onClick=${onClick} aria-label=${label}>${inner}</button>`;
  if (href) return html`<a class=${c} href=${href} target="_blank" rel="noopener" aria-label=${label}>${inner}</a>`;
  return html`<div class=${c}>${inner}</div>`;
}
const Lead = ({ tone, children }) => html`<span class=${"lead-icon " + (tone || "")} aria-hidden="true">${children}</span>`;

/* A fold: a head that opens and closes a body. Escape closes the fold that has focus inside it. */
function Fold({ label, children, open: initial, id }) {
  const [open, setOpen] = useState(!!initial);
  const bodyId = "fold-" + id;
  const onKey = (e) => { if (e.key === "Escape" && open) { e.stopPropagation(); setOpen(false); e.currentTarget.querySelector(".fold-head").focus(); } };
  return html`<div class="fold" onKeyDown=${onKey}>
    <button class="fold-head" aria-expanded=${open} aria-controls=${bodyId} onClick=${() => setOpen(!open)}>
      <span class="chev"><${Icon} n="right" sm /></span>${label}
    </button>
    <div id=${bodyId} class=${"fold-body" + (open ? " open" : "")} inert=${open ? undefined : true}><div>${children}</div></div>
  </div>`;
}

/* A thing's history: each event, who made it and when. */
function History({ entries, id }) {

  return html`<${Section} title="History" count=${list.length} id=${"history-" + id}>

            <span class="muted">${w.kind === "agent" ? cap(w.type) + " thread" : w.kind === "pipeline" ? "Pipeline" : "Person"} · <time datetime=${e.at}>${when(e.at)}</time></span>

/* Labelled paragraphs, for a plan's or a step's written parts. */
const Prose = ({ parts }) => html`<div class="card prose">
  ${parts.filter((p) => p[1]).map(([label, text]) => html`<div class="part"><span class="eyebrow">${label}</span>${Array.isArray(text) ? text : html`<p>${text}</p>`}</div>`)}
</div>`;

/* Where a section's facts came from, with their age; amber and in words once older than 30 minutes. */
function SourceFoot({ source }) {
  const src = (SNAP.derived.sources || []).find((s) => s.id === source);
  if (!src) return null;
  const stale = isStale(src.read);
  return { foot: (stale ? "Stale: " : "") + src.name + ", read " + ago(src.read), stale };
}

// ---- charts.js
// Charts: the burn-down (units left over time, with the line at the current pace to zero, and a crosshair tooltip),
// the ratchet sparkline, and the budget bar. One series each, drawn to one scale, text in the theme's ink.

/* Units left at each change, for any set of steps: planned adds its units, proven or dropped takes them away. */
function burnOf(steps) {
  const evs = [];
  steps.forEach((s) => s.history.forEach((e) => {
    const u = s.fields.units || 1;
    if (e.event === "step_planned") evs.push({ at: e.at, d: u, done: 0, what: "step " + s.id + " planned" });
    if (e.event === "step_proven") evs.push({ at: e.at, d: -u, done: u, what: "step " + s.id + " proven" });
    if (e.event === "step_dropped") evs.push({ at: e.at, d: -u, done: 0, what: "step " + s.id + " dropped" });
    if (e.event === "step_reopened") evs.push({ at: e.at, d: u, done: -u, what: "step " + s.id + " reopened" });
  }));
  evs.sort((a, b) => Date.parse(a.at) - Date.parse(b.at));
  let left = 0, done = 0;
  return evs.map((e) => ({ at: e.at, left: (left += e.d), done: (done += e.done), what: e.what }));
}

/* The verdict: what is left, and how long the rest takes at the pace since the first unit was proven. */
function burnVerdict(series) {
  if (!series.length) return { text: "Nothing planned yet.", sub: "", rate: 0 };
  const last = series[series.length - 1];
  const firstDone = series.find((p) => p.done > 0);
  if (last.left === 0) return { text: "Everything planned is done.", sub: plural(last.done, "unit") + " proven.", rate: 0 };
  if (!firstDone) return { text: plural(last.left, "unit") + " left, none proven yet.", sub: "A pace shows once the first step is proven.", rate: 0 };
  const days = Math.max((nowMs() - Date.parse(firstDone.at)) / 864e5, 0.25);
  const rate = last.done / days;
  const need = last.left / rate;
  const span = need < 1 ? Math.max(1, Math.round(need * 24)) + " hours" : (Math.round(need * 10) / 10) + " days";
  return {
    text: plural(last.left, "unit") + " left. At this pace, about " + span + " more.",
    sub: plural(last.done, "unit") + " proven in " + (Math.round(days * 10) / 10) + " days, about " + Math.round(rate) + " a day.",
    rate,
  };
}

function BurnChart({ series, label }) {
  const [hover, setHover] = useState(null);
  if (series.length < 2) return html`<p class="muted">Not enough history to draw yet.</p>`;
  const W = 340, H = 150, L = 28, R = 8, Tp = 8, B = 22;
  const v = burnVerdict(series);
  const t0 = Date.parse(series[0].at), tNow = nowMs();
  const last = series[series.length - 1];
  const tEnd = v.rate > 0 ? Math.max(tNow, tNow + (last.left / v.rate) * 864e5) : tNow;
  const maxY = Math.max(...series.map((p) => p.left), 1);
  const x = (t) => L + ((t - t0) / Math.max(tEnd - t0, 1)) * (W - L - R);
  const y = (n) => Tp + (1 - n / maxY) * (H - Tp - B);
  let d = "", prev = null;
  series.forEach((p) => {
    const px = x(Date.parse(p.at)), py = y(p.left);
    d += prev == null ? `M${px},${py}` : `H${px}V${py}`;
    prev = py;
  });
  d += `H${x(tNow)}`;
  const area = d + `V${y(0)}H${x(t0)}Z`;
  const ticks = [0, Math.round(maxY / 2), maxY];
  const day = (t) => new Date(t).toLocaleDateString("en-GB", { ...UTC, day: "numeric", month: "short" });
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const t = t0 + (((e.clientX - r.left) / r.width) * W - L) / (W - L - R) * (tEnd - t0);
    let p = null;
    for (const q of series) if (Date.parse(q.at) <= t) p = q;
    setHover(p && t <= tNow ? { p, px: x(Date.parse(p.at)) / W, py: y(p.left) / H } : null);
  };
  return html`<div class="chart" role="img" aria-label=${label + ": " + v.text}>
    <svg viewBox=${`0 0 ${W} ${H}`} onPointerMove=${onMove} onPointerLeave=${() => setHover(null)}>
      ${ticks.map((n) => html`<g><line x1=${L} x2=${W - R} y1=${y(n)} y2=${y(n)} stroke="var(--grid)" stroke-width="1" /><text x=${L - 6} y=${y(n) + 4} text-anchor="end">${n}</text></g>`)}
      <path d=${area} fill="var(--chart-1)" fill-opacity="0.1" />
      <path d=${d} fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" />
      ${v.rate > 0 ? html`<line x1=${x(tNow)} y1=${y(last.left)} x2=${x(tEnd)} y2=${y(0)} stroke="var(--chart-ref)" stroke-width="2" stroke-dasharray="4 4" />` : null}
      <circle cx=${x(tNow)} cy=${y(last.left)} r="4" fill="var(--chart-1)" stroke="var(--surface)" stroke-width="2" />
      <text x=${L} y=${H - 4}>${day(t0)}</text>
      <text x=${x(tNow)} y=${H - 4} text-anchor=${tEnd > tNow + 3600e3 ? "middle" : "end"}>Now</text>
      ${tEnd > tNow + 3600e3 ? html`<text x=${W - R} y=${H - 4} text-anchor="end">${day(tEnd)}</text>` : null}
      ${hover ? html`<line x1=${hover.px * W} x2=${hover.px * W} y1=${Tp} y2=${y(0)} stroke="var(--ink-3)" stroke-width="1" />` : null}
    </svg>
    ${hover ? html`<div class="tip" style=${`left:${hover.px * 100}%;top:${hover.py * 100}%`}><b class="num">${hover.p.left} left</b> · ${hover.p.what}<br /><span class="muted">${when(hover.p.at)}</span></div>` : null}
  </div>`;
}

function BurnCard({ steps, series, label }) {
  const s = series || burnOf(steps);
  const v = burnVerdict(s);
  return html`<div class="card">
    <div><p class="verdict">${v.text}</p>${v.sub ? html`<p class="verdict-sub">${v.sub}</p>` : null}</div>
    <${BurnChart} series=${s} label=${label} />
    <div class="legend"><span><i></i>Units left</span>${v.rate > 0 ? html`<span><i class="ref"></i>At this pace</span>` : null}</div>
  </div>`;
}

function Sparkline({ series }) {
  const W = 120, H = 40, P = 4;
  const pts = series.map((p) => p.count);
  if (pts.length < 2) {
    return html`<svg viewBox=${`0 0 ${W} ${H}`} aria-hidden="true"><line x1=${P} x2=${W - P} y1=${H / 2} y2=${H / 2} stroke="var(--chart-1)" stroke-width="2" /><circle cx=${W - P} cy=${H / 2} r="3" fill="var(--chart-1)" /></svg>`;
  }
  const t = series.map((p) => Date.parse(p.at));
  const min = Math.min(...pts), max = Math.max(...pts), span = Math.max(max - min, 1);
  const x = (i) => P + ((t[i] - t[0]) / Math.max(t[t.length - 1] - t[0], 1)) * (W - 2 * P);
  const y = (n) => P + (1 - (n - min) / span) * (H - 2 * P);
  const d = pts.map((n, i) => (i ? "L" : "M") + x(i) + "," + y(n)).join("");
  return html`<svg viewBox=${`0 0 ${W} ${H}`} aria-hidden="true">
    <line x1=${P} x2=${W - P} y1=${y(max)} y2=${y(max)} stroke="var(--chart-ref)" stroke-width="1" stroke-dasharray="3 3" />
    <path d=${d + `L${x(pts.length - 1)},${H}L${x(0)},${H}Z`} fill="var(--chart-1)" fill-opacity="0.1" />
    <path d=${d} fill="none" stroke="var(--chart-1)" stroke-width="2" stroke-linejoin="round" />
    <circle cx=${x(pts.length - 1)} cy=${y(pts[pts.length - 1])} r="3" fill="var(--chart-1)" />
  </svg>`;
}

/* The p95 of a list of measures. */
function p95(xs) {
  const s = [...xs].sort((a, b) => a - b);
  return s[Math.min(s.length - 1, Math.ceil(0.95 * s.length) - 1)];
}

// ---- now.js
// Now: only what needs Aaron. Each ask is a card he answers in place (an option, or his own words), with an undo
// toast; then the threads waiting on him, the health of master and the last full run, and the sitreps not yet heard.

function AskCard({ ask, standalone }) {

  const ans = done ? [...historyOf("ask", ask)].reverse().find((e) => e.event === "ask_answered") : null;
  const a = ans && ans.answer;
  const example = /^ask-example-/.test(ask.id);
  const send = () => { if (text.trim().length >= 3) { answerAsk(ask, { own: text.trim() }); setOwn(false); setText(""); } };
  return html`<article class=${"ask" + (done ? " resolved" : "")} aria-label=${(done ? "Answered: " : "") + f.question} data-ask=${ask.id}>
    <div class="ask-who">
      <span class="avatar" aria-hidden="true">${t.emoji}</span>
      <span class="who"><b>${t.name}</b><span class="muted">${done ? "Answered by you, " + clock(ans.at) : "Waiting " + ago(ask.since).replace(" ago", "")}</span></span>

          aria-label=${(chosen ? "Chosen: " : "Choose ") + o.key + ": " + o.title + (o.key === f.recommended ? ", recommended" : "")}>
          <span class="letter" aria-hidden="true">${chosen ? html`<${Icon} n="check" sm />` : o.key}</span>
          <span class="o-body">

      })}
      ${done && a && a.own ? html`<div class="option chosen own-answer"><span class="letter" aria-hidden="true"><${Icon} n="check" sm /></span>

    <div class="ask-foot">

}

        ${unheard.slice(0, 3).map((s) => html`<${Row} key=${s.id} cls="sitrep-row" onClick=${() => { store.set({ openSitrep: s.id }); nav.tab("sitreps"); }}
          lead=${html`<span class="dot-unheard" aria-label="Not heard"></span>`} title=${s.fields.title} meta=${html`<span>${when(s.since)}</span><span>${plural(s.fields.parts.length, "part")}</span>`} />`)}
      </div>` : html`<p class="muted section-foot">You have heard every sitrep.</p>`}

  </${Page}>`;
}

// ---- plan.js
// Plan: the written plan, its state and burn-down, then its milestones. A milestone's page groups its steps Moving
// and Not started, with Done folded; a step's page shows what it needs (linked), its lane, proof, pull requests and
// the ratchet it closes. Each ends with its history.

const stepsOf = (m) => (m.fields.steps || []).map((id) => IX.steps[id]).filter(Boolean);
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const ratchetsClosing = (stepId) =>
  SNAP.derived.measures.ratchets.filter((r) => String(r.closes).split(/[ ,]+/).includes(stepId));

function StepRow({ step, rel }) {
  const lane = laneOfStep(step.id);
  return html`<${Row} onClick=${() => nav.push({ kind: "step", id: step.id })} dim=${step.state === "done" && !rel}
    lead=${html`<span class="mono step-id">${step.id}</span>`}

    meta=${html`<${Chip} s=${step.state} />${lane ? html`<span>${lane.fields.title}</span>` : null}${step.state !== "planned" ? html`<span>${ago(step.since)}</span>` : null}`} />`;
}

function MilestoneRow({ m }) {
  return html`<${Row} onClick=${() => nav.push({ kind: "milestone", id: m.id })}
    lead=${html`<span class=${"ring" + (m.done === m.of && m.of ? " done" : "")} style=${"--p:" + pct(m.done, m.of)} aria-hidden="true">${m.done === m.of && m.of ? html`<${Icon} n="check" sm />` : null}</span>`}
    title=${m.fields.title}
    meta=${html`<${Chip} s=${m.done === m.of && m.of ? "done" : m.state} /><span>Milestone ${m.id}</span><span class="num">${m.done} of ${m.of} units</span>`}
    label=${"Milestone " + m.id + ": " + m.fields.title} />`;
}

function PlanScreen() {

function MilestonePage({ id, back }) {

// ---- lanes.js
// Lanes: one row per lane, like an agent's session (its lead, its current step, its pull request, its age). A lane's
// page has its lead, steps, pull requests, threads, sitreps and history. Measures: ratchets, the run's budget, evals.

function laneFacts(l) {
  const steps = (l.fields.steps || []).map((id) => IX.steps[id]).filter(Boolean);
  const current = steps.find((s) => s.state === "active") || steps.find((s) => s.state === "planned") || steps[steps.length - 1];
  const pulls = SNAP.derived.pulls.filter((p) => p.lane === l.id);
  const slice = pulls.find((p) => /^slice\//.test(p.title));
  const threads = SNAP.threads.filter((t) => t.fields.lane === l.id);
  const latest = [l.since, ...threads.map((t) => t.since), ...steps.map((s) => s.since)].sort().pop();
  return { steps, current, pulls, slice, threads, latest };
}

function verdictOf(r) {
  const s = r.series || [];
  if (s.length < 2) return { text: "One reading so far", tone: "" };
  const today = s.filter((p) => dayLabel(p.at) === "Today");
  const base = (today.length > 1 ? today : s)[0].count, d = s[s.length - 1].count - base;
  const span = today.length > 1 ? " today" : "";
  if (d < 0) return { text: "Down " + -d + span, tone: "good" };
  if (d > 0) return { text: "Up " + d + span, tone: "bad" };
  return { text: "Flat" + span, tone: "" };
}

function BudgetCard({ b }) {
  const p = p95(b.measured), review = b.budget * 1.5, max = Math.max(p, review) * 1.1;
  const over = p > review;
  const at = (n) => (n / max) * 100 + "%";
  return html`<div class="card">
    <div class="section-head"><span class="what"><b>${b.name}</b></span><span class=${"chip " + (over ? "bad" : "good")}><span class="dot"></span>${over ? "Review due" : "Within"}</span></div>
    <p class="verdict">p95 is ${p} ${b.unit}, ${Math.round((p / b.budget) * 10) / 10}× the ${b.budget}-${b.unit === "min" ? "minute" : b.unit} budget.</p>
    <p class="verdict-sub">${over ? "Past 1.5 times its budget, so an architecture review is raised. A budget never fails a run." : "Within 1.5 times its budget."} ${plural(b.measured.length, "run")} measured.</p>
    <div class=${"budget-bar" + (over ? " over" : "")} role="meter" aria-valuenow=${p} aria-valuemax=${max} aria-label=${b.name + " p95 against budget"}>
      <i style=${"width:" + at(p)}></i><span class="tick" style=${"left:" + at(b.budget)}></span><span class="tick review" style=${"left:" + at(review)}></span>
    </div>
    <div class="legend"><span><i class="tick-key"></i>Budget ${b.budget} ${b.unit}</span><span><i class="tick-key review"></i>Review at ${review} ${b.unit}</span><span><i class=${"bar-key" + (over ? " over" : "")}></i>p95 ${p} ${b.unit}</span></div>
  </div>`;
}

// ---- sitreps.js
// Sitreps: a feed by day, unheard bold with a dot, partly heard with a bar, heard dimmed. Tap one to fold it open:
// its parts (tap a part to play from it), play, mark heard, links, history. The player reads through the artifact's
// tts capability: one line per part, so back, forward and the parts bar start a new reading from another part.

let TTS; // undefined while asking, null where reading aloud is not available
const P = { sid: null, cur: -1, state: "idle", n: 0 };
function setP(patch) { Object.assign(P, patch); store.set({ player: { ...P } }); }

function initTts() {
  const use = window.claude && window.claude.use;
  if (!use) { TTS = null; store.set({ tts: "no" }); return; }
  Promise.resolve(use("tts")).then((t) => {
    TTS = t || null;
    store.set({ tts: TTS ? "yes" : "no" });
    if (!TTS) return;
    TTS.onState(({ state, reason }) => {
      if (state === "idle") {
        const s = IX.sitreps[P.sid];
        if (reason === "completed" && s) markHeard(s);
        if (reason !== "replaced") setP({ state: "idle" });
      } else setP({ state });
    });
    TTS.onLine(({ id }) => {
      const i = Number(id);
      if (Number.isNaN(i)) return;
      setP({ cur: i });
      store.set((s) => ({ heardParts: { ...s.heardParts, [P.sid]: Math.max(s.heardParts[P.sid] || 0, i) } }));
    });
  }, () => { TTS = null; store.set({ tts: "no" }); });
}

function speakFrom(sitrep, i) {
  if (!TTS) return;
  const parts = sitrep.fields.parts;
  if (i < 0 || i >= parts.length) return;
  setP({ sid: sitrep.id, cur: i, state: "starting", n: parts.length });
  const lines = parts.slice(i).map((text, k) => ({ id: String(i + k), text: (i + k === 0 ? sitrep.fields.title + ". " : "") + text }));
  TTS.speak(lines, { rate: store.s.rate }).catch((err) => {
    if (err && err.code === "stopped") return;
    if (err && (err.code === "not_granted" || err.code === "unavailable")) { TTS = null; store.set({ tts: "no" }); }
    if (err && err.code === "rate_limited") toast("Reading aloud is busy. Try again in a minute.");
    setP({ state: "idle" });
  });
}
const player = {
  toggle() { if (!TTS) return; if (P.state === "paused") TTS.resume(); else if (P.state !== "idle") TTS.pause(); },
  back() { const s = IX.sitreps[P.sid]; if (s) speakFrom(s, Math.max(0, P.cur - 1)); },
  forward() { const s = IX.sitreps[P.sid]; if (!s) return; if (P.cur + 1 < s.fields.parts.length) speakFrom(s, P.cur + 1); else player.stop(); },
  jump(i) { const s = IX.sitreps[P.sid]; if (s) speakFrom(s, i); },
  stop() { if (TTS) TTS.stop(); setP({ state: "idle" }); },
  rate(r) { store.set({ rate: r }); if (TTS && TTS.setRate) TTS.setRate(r); },
};
const SPEEDS = [0.75, 1, 1.25, 1.5];

function MiniPlayer() {
  const st = useStore();
  const [speeds, setSpeeds] = useState(false);
  const s = IX.sitreps[P.sid];
  if (!s || P.state === "idle") return null;
  const n = s.fields.parts.length;
  return html`<div class="player" role="region" aria-label="Player">
    <div class="top">
      <span class="np"><b>${s.fields.title}</b><span>Part ${P.cur + 1} of ${n}${P.state === "paused" ? " · Paused" : ""}</span></span>
      <span class="ctl">
        <button class="icon-btn" onClick=${player.back} aria-label="Back one part"><${Icon} n="back" /></button>
        <button class="play" onClick=${player.toggle} aria-label=${P.state === "paused" ? "Resume" : "Pause"}><${Icon} n=${P.state === "paused" ? "play" : "pause"} /></button>
        <button class="icon-btn" onClick=${player.forward} aria-label="Forward one part"><${Icon} n="fwd" /></button>
        <button class="speed num" onClick=${() => setSpeeds(!speeds)} aria-expanded=${speeds} aria-label=${"Speed " + st.rate + "×"}>${st.rate}×</button>
        <button class="icon-btn" onClick=${player.stop} aria-label="Stop"><${Icon} n="x" /></button>
      </span>
    </div>
    ${speeds ? html`<div class="speeds" role="group" aria-label="Speed">${SPEEDS.map((r) => html`<button class="num" aria-pressed=${st.rate === r} onClick=${() => { player.rate(r); setSpeeds(false); }}>${r}×</button>`)}</div>` : null}
    <div class="parts" role="group" aria-label="Parts">${s.fields.parts.map((_, i) => html`<button class=${i < P.cur ? "done" : i === P.cur ? "current" : ""} onClick=${() => player.jump(i)} aria-label=${"Play part " + (i + 1)} aria-current=${i === P.cur ? "true" : undefined}><i></i></button>`)}</div>
  </div>`;
}

function SitrepItem({ s, open }) {
  const st = store.s;
  const heard = stateOf("sitrep", s) === "heard";
  const n = s.fields.parts.length, got = st.heardParts[s.id] || 0;
  const partly = !heard && got > 0;
  const playingThis = P.sid === s.id && P.state !== "idle";
  const toggle = () => store.set({ openSitrep: open ? null : s.id });
  return html`<div class=${"sitrep-item" + (heard ? " heard" : "")} data-sitrep=${s.id}>
    <button class=${"row sitrep-row" + (heard ? " heard dim" : "")} aria-expanded=${open} onClick=${toggle}>
      ${heard ? html`<${Lead}><${Icon} n="check" sm /></${Lead}>` : html`<span class="dot-slot">${partly ? null : html`<span class="dot-unheard"></span>`}</span>`}
      <span class="body"><span class="title">${s.fields.title}</span>
        <span class="meta"><span>${clock(s.since)}</span><span>${plural(n, "part")}</span>${heard ? html`<span>Heard</span>` : partly ? html`<span class="bar progress" aria-label=${"Heard " + got + " of " + n}><i style=${"width:" + Math.round((got / n) * 100) + "%"}></i></span>` : html`<span class="sr">Not heard</span>`}</span></span>
      <span class="chev"><${Icon} n=${open ? "x" : "right"} sm /></span>
    </button>
    ${open ? html`<div class="sitrep-open">
      <div>${s.fields.parts.map((t, i) => html`<button class=${"part-btn" + (playingThis && P.cur === i ? " playing" : "")} disabled=${st.tts !== "yes"} onClick=${() => speakFrom(s, i)} aria-label=${"Play from part " + (i + 1)}><span class="n">${i + 1}</span><span>${t}</span></button>`)}</div>
      <div class="btn-row">
        ${st.tts === "yes" ? html`<button class="btn primary" onClick=${() => (playingThis ? player.toggle() : speakFrom(s, 0))}><${Icon} n=${playingThis && P.state !== "paused" ? "pause" : "play"} sm />${playingThis ? (P.state === "paused" ? "Resume" : "Pause") : "Play"}</button>` : null}
        <button class="btn" disabled=${heard} onClick=${() => markHeard(s)}><${Icon} n="check" sm />${heard ? "Heard" : "Mark heard"}</button>
      </div>
      ${(s.fields.links || []).length ? html`<div class="group">${s.fields.links.map((l) => html`<${Row} href=${l.href} key=${l.href} title=${l.label} />`)}</div>` : null}
      <${History} entries=${historyOf("sitrep", s)} id=${"r" + s.id} />
    </div>` : null}
  </div>`;
}

function SitrepsScreen() {
  const st = useStore();
  const reps = [...SNAP.sitreps].sort((a, b) => Date.parse(b.since) - Date.parse(a.since));
  const days = [];
  reps.forEach((s) => { const d = dayLabel(s.since); const g = days.find((x) => x.d === d); g ? g.list.push(s) : days.push({ d, list: [s] }); });
  const unheard = reps.filter((s) => stateOf("sitrep", s) !== "heard").length;
  return html`<${Page} title="Sitreps" pageKey="sitreps" sub=${unheard ? unheard + " not heard" : "All heard"}>
    ${st.tts === "no" ? html`<div class="note" role="status"><${Icon} n="speaker" sm /><span>Reading aloud is not available here. Every sitrep stays readable below.</span></div>` : null}
    ${days.map((g) => html`<${Section} key=${g.d} id=${"day-" + g.d}>
      <div class="day-head">${g.d}<span class="count">${g.list.length}</span></div>
      <div class="group">${g.list.map((s) => html`<${SitrepItem} s=${s} open=${st.openSitrep === s.id} key=${s.id} />`)}</div>
    </${Section}>`)}
  </${Page}>`;
}

// ---- app.js
// The shell: five tabs on a phone (a sidebar on a laptop), pushed pages with a back chevron (a right panel on a
// laptop), the toast, the mini player, and the loading, error and empty states. #loading, #error and #empty show
// those states on purpose, for review.

const ROOTS = { now: NowScreen, plan: PlanScreen, lanes: LanesScreen, measures: MeasuresScreen, sitreps: SitrepsScreen };
const ROOT_TITLES = { now: "Now", plan: "Plan", lanes: "Lanes", measures: "Measures", sitreps: "Sitreps" };
const PAGES = { milestone: MilestonePage, step: StepPage, lane: LanePage, ask: AskPage };
function titleOf(e) {
  if (e.kind === "milestone") return IX.milestones[e.id].fields.title;
  if (e.kind === "step") return "Step " + e.id;
  if (e.kind === "lane") return IX.lanes[e.id].fields.title;
  return "Ask";
}

function useWide() {
  const q = window.matchMedia("(min-width: 960px)");
  const [wide, setWide] = useState(q.matches);
  useEffect(() => { const f = () => setWide(q.matches); q.addEventListener("change", f); return () => q.removeEventListener("change", f); }, []);
  return wide;
}

function Tabs({ cls, itemCls }) {
  const st = useStore();
  const badge = openAsks().length;
  return html`<nav class=${cls} aria-label="Sections">
    ${cls === "sidebar" ? html`<div class="brand"><span class="mark"><${Icon} n="plan" /></span><span><b>Sitrep</b><span>The Capxul rebuild</span></span></div>` : null}
    ${TABS.map((t) => html`<button class=${itemCls} key=${t.id} aria-current=${st.tab === t.id ? "page" : undefined} onClick=${() => nav.tab(t.id)} data-tab=${t.id}>
      <${Icon} n=${t.icon} /><span>${t.label}</span>
      ${t.id === "now" && badge ? html`<span class="badge num" aria-label=${badge + " waiting"}>${badge}</span>` : null}
    </button>`)}
    ${cls === "sidebar" ? html`<div class="side-foot">${SNAP.derived.sources.map((s) => html`<span class=${isStale(s.read) ? "warn-ink" : ""} key=${s.id}>${s.name}: ${ago(s.read)}</span>`)}</div>` : null}
  </nav>`;
}

function Toast() {
  const st = useStore();
  if (!st.toast) return null;
  const lift = P.state !== "idle";
  return html`<div class=${"toast" + (lift ? " lift" : "")} role="status" aria-live="polite">
    <span>${st.toast.text}</span>
    ${st.toast.undo ? html`<button onClick=${st.toast.undo}>Undo</button>` : null}
  </div>`;
}

function App() {
  const st = useStore();
  const wide = useWide();
  const stack = st.stacks[st.tab];
  const Root = ROOTS[st.tab];
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== "Escape" || e.defaultPrevented) return;
      if (store.s.openSitrep) store.set({ openSitrep: null });
      else if (store.s.stacks[store.s.tab].length) nav.pop();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  const pageAt = (e, i, cls) => {
    const C = PAGES[e.kind];
    const back = i === 0 ? ROOT_TITLES[st.tab] : titleOf(stack[i - 1]);
    return html`<div class=${"stack-page " + cls} key=${e.kind + e.id + i}><${C} id=${e.id} back=${back} /></div>`;
  };
  const top = stack.length - 1;
  return html`<div class="app" data-wide=${wide}>
    ${wide ? html`<${Tabs} cls="sidebar" itemCls="side-item" />` : null}
    <main class="main">
      <div class=${"stack-page" + (!wide && stack.length ? " under" : "")} key=${"root-" + st.tab}><${Root} /></div>
      ${!wide ? stack.map((e, i) => pageAt(e, i, i === top ? "pushed enter" : "under")) : null}
    </main>
    ${wide && stack.length ? html`<aside class="panel" aria-label="Detail">${pageAt(stack[top], top, "enter")}</aside>` : null}
    ${wide ? null : html`<${Tabs} cls="tabbar" itemCls="tab" />`}
    <${MiniPlayer} />
    <${Toast} />
  </div>`;
}

class Boundary extends preact.Component {
  constructor() { super(); this.state = { error: null }; }
  componentDidCatch(error) { this.setState({ error }); }
  render() { return this.state.error ? html`<${ErrorPage} error=${this.state.error} />` : this.props.children; }
}
const ErrorPage = ({ error }) => html`<div class="error-page" role="alert"><div class="card">
  <span class="lead-icon bad"><${Icon} n="warn" /></span>
  <h1>The sitrep could not be shown</h1>
  <p>The snapshot did not match the blueprint's shapes, so nothing is shown rather than something wrong. The next refresh rebuilds it; if this stays, the refresh's run says why.</p>
  <pre>${String(error && error.message ? error.message : error)}</pre>
</div></div>`;

(function start() {
  const root = document.getElementById("app");
  const demo = location.hash.slice(1);
  if (demo === "loading") return;
  if (!SNAP || demo === "error") {
    render(html`<${ErrorPage} error=${SNAP ? "Demo: snapshot refused (event 41 is no declared event)." : "No snapshot was embedded in the page."} />`, root);
    return;
  }
  if (demo === "empty") { SNAP.needsYou = { asks: [], threads: [] }; }
  root.textContent = "";
  initTts();
  render(html`<${Boundary}><${App} /></${Boundary}>`, root);
})();

})();
</script>
