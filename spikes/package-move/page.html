<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>World Layout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an editor window. Toolbar, then explorer | file pane; on phones the explorer stacks above the file. */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --side:#eef0f4; --line:#d9dde5; --fg:#1d2330; --muted:#5f6878;
  --accent:#2f5bd3; --sel:#dfe7fb;
  --dom:#2f7d4f; --lang:#7a4cc2; --gen:#9a6a12; --out:#b0453a; --pipe:#356f8f;
  --code-bg:#fbfbfc; --gutter:#9aa2b1;
  --k:#7a3fb8; --s:#2a7a3a; --c:#7c8596; --t:#b0453a; --n:#9a5b00;
  --ui:"IBM Plex Sans", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171d; --panel:#1b1f27; --side:#171a21; --line:#2c323d; --fg:#e3e7ee; --muted:#9aa3b3;
  --accent:#7ea2ff; --sel:#25324f; --dom:#6fcf97; --lang:#b99af0; --gen:#e0b35a; --out:#f08a7e; --pipe:#7cc3e6;
  --code-bg:#171a21; --gutter:#5d6573; --k:#c69cf5; --s:#8fd19e; --c:#7d8696; --t:#f2998e; --n:#e7b860; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1b1f27; --side:#171a21; --line:#2c323d; --fg:#e3e7ee; --muted:#9aa3b3;
  --accent:#7ea2ff; --sel:#25324f; --dom:#6fcf97; --lang:#b99af0; --gen:#e0b35a; --out:#f08a7e; --pipe:#7cc3e6;
  --code-bg:#171a21; --gutter:#5d6573; --k:#c69cf5; --s:#8fd19e; --c:#7d8696; --t:#f2998e; --n:#e7b860; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box;gap:10px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:500 13px var(--ui);color:var(--muted);background:none;border:0;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg button:focus-visible,.tree button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:12px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;background:var(--c-)}
.intro{color:var(--muted);font-size:13px;max-width:75ch;margin:0}
.win{flex:1;min-height:0;display:grid;grid-template-columns:minmax(220px,300px) 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.side{background:var(--side);border-right:1px solid var(--line);overflow:auto;min-width:0;padding:6px 0}
.side h2{font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 12px 4px}
.tree{list-style:none;margin:0;padding:0}
.tree .tree{padding-left:12px}
.tree button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:3px 10px;cursor:pointer;font:13px var(--ui);white-space:nowrap}
.tree button:hover{background:color-mix(in srgb,var(--sel) 60%,transparent)}
.tree button[aria-current="true"]{background:var(--sel)}
.tw{width:10px;color:var(--muted);font-size:10px}
.dot{width:7px;height:7px;border-radius:2px;flex:none;background:var(--muted)}
.k-domain{--c-:var(--dom)} .k-lang{--c-:var(--lang)} .k-gen{--c-:var(--gen)} .k-out{--c-:var(--out)} .k-pipe{--c-:var(--pipe)}
.dot.k-domain,.dot.k-lang,.dot.k-gen,.dot.k-out,.dot.k-pipe{background:var(--c-)}
.fname.gen{color:var(--gen)} .del{color:var(--out);text-decoration:line-through}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.tab{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);font:500 13px var(--mono);overflow-x:auto;white-space:nowrap}
.note{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--fg);background:color-mix(in srgb,var(--sel) 45%,var(--panel))}
.note b{font-weight:600}
.note code{font:12px var(--mono)}
.code{flex:1;overflow:auto;background:var(--code-bg);min-height:0}
pre{margin:0;padding:10px 0;font:12.5px/1.55 var(--mono);counter-reset:ln;tab-size:2}
pre .l{display:block;padding-right:16px;white-space:pre}
pre .l::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:var(--gutter);user-select:none}
.hljs-keyword,.hljs-built_in{color:var(--k)} .hljs-string{color:var(--s)} .hljs-comment{color:var(--c);font-style:italic}
.hljs-title,.hljs-title.class_{color:var(--t)} .hljs-number,.hljs-literal{color:var(--n)} .hljs-section{color:var(--accent);font-weight:600}
.empty{padding:24px;color:var(--muted)}
@media (max-width:760px){
  body{height:auto}
  .win{grid-template-columns:1fr;grid-template-rows:auto auto}
  .side{max-height:46vh;border-right:0;border-bottom:1px solid var(--line)}
  .code{max-height:70vh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header>
  <h1>The world, things then verbs</h1>
  <div class="seg" role="group" aria-label="Which tree">
    <button id="m-before" type="button" aria-pressed="false">Before</button>
    <button id="m-after" type="button" aria-pressed="true">After</button>
  </div>
  <div class="legend">
    <span class="k-domain">a thing and its verbs</span>
    <span class="k-pipe">a part, running in the cloud</span>
    <span class="k-lang">the account, served outside any world</span>
    <span class="k-out">Alchemy, the command line, what all share</span>
    <span class="k-gen">generated, never edited</span>
  </div>
</header>
<p class="intro" id="intro"></p>
<div class="win">
  <nav class="side" aria-label="Files"><h2 id="side-title">Explorer</h2><ul class="tree" id="tree"></ul></nav>
  <section class="main">
    <div class="tab" id="tab"></div>
    <div class="note" id="note"></div>
    <div class="code" id="code"><div class="empty">Choose a file.</div></div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
let mode = "after", current = null;
const open = new Set(["packages", "packages/world", "packages/world/src", "packages/world/src/things", "packages/world/src/things/world", "src", "src/lifecycle"]);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const disp = p => p;
function kindOf(p){
  if (p.includes("/generated/") ) return "k-gen";
  if (p.includes("/src/things/")) return "k-domain";
  if (p.includes("/src/parts/")) return "k-pipe";
  if (p.includes("/src/account/")) return "k-lang";
  if (/\/src\/(stack|cli|common|proofs)\//.test(p) || p.endsWith("/src/index.ts")) return "k-out";
  return "";
}
function kindBefore(p){ const g = D.goes[p]; return g && g.length ? kindOf(g[0]) : (D.removed[p] ? "" : ""); }
function files(){ return mode === "after" ? Object.keys(D.after) : Object.keys(D.before); }
function buildTree(paths){
  const root = {dirs:{}, files:[]};
  for (const raw of paths){
    const p = disp(raw); const parts = p.split("/"); let n = root;
    for (let i = 0; i < parts.length - 1; i++){ n.dirs[parts[i]] ??= {dirs:{}, files:[]}; n = n.dirs[parts[i]]; }
    n.files.push({name: parts.at(-1), path: raw});
  }
  return root;
}
function render(){
  document.getElementById("m-before").setAttribute("aria-pressed", mode === "before");
  document.getElementById("m-after").setAttribute("aria-pressed", mode === "after");
  document.querySelector("h1").textContent = mode === "after" ? "The world, things then verbs" : "packages/world today";
  document.getElementById("intro").textContent = mode === "after"
    ? "Every verb is a file in the folder of the thing it acts on: things/world/reset.ts is world reset. Every file is today's code, moved whole, with its imports rewritten to the new paths; the line above it says where it came from and why. generated/index.md is the map, built from each file's opening comment. Nothing has moved yet."
    : "Today's src/: thirteen folders of mixed kinds and three loose files. The colour of each file shows the kind of folder it goes to; click a file to see where.";
  const ul = document.getElementById("tree"); ul.innerHTML = "";
  const tree = buildTree(files());
  ul.append(...nodes(tree, ""));
  if (mode === "before") for (const p of Object.keys(D.removed)) if (!(p in D.before)) {}
}
function nodes(n, prefix){
  const out = [];
  const dirs = Object.keys(n.dirs).sort((a,b) => a.startsWith("↗") - b.startsWith("↗") || a.localeCompare(b));
  for (const d of dirs){
    const key = prefix ? prefix + "/" + d : d;
    const li = document.createElement("li");
    const b = document.createElement("button"); b.type = "button";
    const isOpen = open.has(key);
    b.setAttribute("aria-expanded", isOpen);
    b.innerHTML = `<span class="tw">${isOpen ? "▾" : "▸"}</span><span class="dot ${dirKind(key)}"></span><span>${esc(d)}/</span>`;
    b.onclick = () => { isOpen ? open.delete(key) : open.add(key); render(); };
    li.append(b);
    if (isOpen){ const sub = document.createElement("ul"); sub.className = "tree"; sub.append(...nodes(n.dirs[d], key)); li.append(sub); }
    out.push(li);
  }
  for (const f of n.files.sort((a,b) => a.name.localeCompare(b.name))){
    const li = document.createElement("li");
    const b = document.createElement("button"); b.type = "button";
    const k = mode === "after" ? kindOf(f.path) : kindBefore(f.path);
    const removed = mode === "before" && D.removed[f.path];
    b.innerHTML = `<span class="tw"></span><span class="dot ${k}"></span><span class="fname ${k === "k-gen" && mode === "after" ? "gen" : ""} ${removed ? "del" : ""}">${esc(f.name)}</span>`;
    if (current === f.path) b.setAttribute("aria-current", "true");
    b.onclick = () => show(f.path);
    li.append(b); out.push(li);
  }
  return out;
}
function dirKind(key){
  const p = key + "/x";
  return mode === "after" ? kindOf(p) : "";
}
function highlight(text, path){
  const lang = path.endsWith(".md") ? "markdown" : path.endsWith(".json") ? "json" : "typescript";
  let html;
  try { html = window.hljs ? hljs.highlight(text, {language: lang}).value : esc(text); } catch { html = esc(text); }
  const out = []; let stack = [];
  for (const line of html.split("\n")){
    let l = stack.join("") + line;
    for (const m of line.matchAll(/<span[^>]*>|<\/span>/g)) m[0] === "</span>" ? stack.pop() : stack.push(m[0]);
    l += "</span>".repeat(stack.length);
    out.push(`<span class="l">${l || " "}</span>`);
  }
  return `<pre><code>${out.join("")}</code></pre>`;
}
function show(path){
  current = path;
  const tab = document.getElementById("tab"), note = document.getElementById("note"), code = document.getElementById("code");
  tab.textContent = disp(path);
  if (mode === "after"){
    const e = D.after[path];
    const from = e.from === "(new)" ? "New." : (e.from === path ? (e.kind === "kept" ? "Stays where it is." : "") : `From <code>${esc(e.from)}</code>.`);
    note.innerHTML = `<b>${from}</b> ${esc(e.note)}`;
    code.innerHTML = highlight(e.content, path);
  } else {
    const r = D.removed[path], g = D.goes[path] || [];
    note.innerHTML = r ? `<b>Folded away.</b> ${esc(r)}` : `<b>Goes to</b> ${g.map(x => `<code>${esc(disp(x))}</code>`).join(", ")}.`;
    code.innerHTML = highlight(D.before[path], path);
  }
  code.scrollTop = 0;
  render();
}
document.getElementById("m-before").onclick = () => { mode = "before"; const p = current; current = null;
  const back = p && Object.keys(D.goes).find(k => (D.goes[k] || []).includes(p)); open.add("src"); render(); show(back && D.before[back] !== undefined ? back : "README.md"); };
document.getElementById("m-after").onclick = () => { mode = "after"; const p = current; current = null;
  const fwd = p && (D.goes[p] || [])[0]; render(); show(fwd && D.after[fwd] ? fwd : START); };
const START = "packages/world/src/things/world/reset.ts"; render(); show(START);
</script>

</body></html>
