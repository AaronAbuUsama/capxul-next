# Roadmap step 1.8: CI runs the thin line's scenarios in a private world and keeps the run record, on every pull
# request into master and every push to master.
#
# The runner owns the worlds (packages/runner, "A run in one world"): it brings up its own fleet hub, makes one world
# on it, resets it before each journey, and destroys the world and takes the hub down at the end, whatever happened
# (world lifecycle rule 1). A world's Core runs on Cloudflare and reaches its company sites on the platform's bench,
# the stage WORLD_BENCH names (staging, deployed by platform.yml; packages/world src/site/Bench.ts). A sweep after
# it removes any world that outlived its expiry.
#
# Gated: on a pull request or a push to master it runs only once the repository variable CAPXUL_CLOUD_READY is
# `true`, which packages/platform/bootstrap sets last, after the Cloudflare and Neon keys are repository secrets.
# Started by hand it always runs, and a missing secret fails it by name: a skipped check is not a green one.
name: world
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: world-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
jobs:
  thin-line:
    if: github.event_name == 'workflow_dispatch' || vars.CAPXUL_CLOUD_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require the cloud secrets and variables
        run: packages/platform/bin/require.sh CLOUDFLARE_API_TOKEN NEON_API_KEY CLOUDFLARE_ACCOUNT_ID NEON_ORG_ID
      - uses: ./.github/actions/platform-setup
      - name: Run the thin line's scenarios
        env:
          WORLD_OWNER: ci
          WORLD_BENCH: staging
          RUNNER_RECORDS: ${{ runner.temp }}/records
        run: packages/runner/run.sh scenarios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/records/
          if-no-files-found: warn
      - name: Sweep worlds that outlived their expiry
        if: always()
        run: packages/world/run.sh sweep
