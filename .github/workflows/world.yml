# Roadmap step 1.8: CI on master creates a private world, runs the thin line's scenarios in it, keeps the run record
# and destroys the world, every time, even when a scenario fails or the job is cancelled (world lifecycle rule 1).
#
# Gated: on a pull request or a push to master it runs only once the repository variable CAPXUL_CLOUD_READY is
# `true`, which packages/platform/bootstrap sets last, after the Cloudflare and Neon keys are repository secrets. Until
# then master stays green on the ladder alone, rather than red for a known reason that would hide a real one. Started
# by hand it always runs, and from then on a missing secret fails it by name: a skipped check is not a green one.
#
# Where it plugs in: packages/world (step 1.3) and packages/runner (step 1.2) are being built on other branches. The
# job is written against their documented commands:
#   packages/world/run.sh create <name> --owner ci --lifetime "2 hours"   (packages/world/README.md, "Commands")
#   packages/world/run.sh destroy <name>
#   packages/world/run.sh sweep
#   pnpm --filter @capxul/runner run scenarios -- --world <name> --records <dir>   (PLUG-IN: the runner's command, to
#                                                                                   be confirmed when it lands)
# Until both packages are on master, the job fails at "Require the world and the runner" and says so.
name: world
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: world-${{ github.ref }}
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  NEON_ORG_ID: ${{ vars.NEON_ORG_ID }}
jobs:
  # Every world lives on the fleet hub (packages/world/README.md, "How a stage gets its hub"). `hub up` makes it when
  # it is missing and, on a live hub, only moves its expiry (about 10 s), so CI's worlds never find it gone or expired.
  # One run at a time deploys it: the state store has no lock.
  hub:
    if: github.event_name == 'workflow_dispatch' || vars.CAPXUL_CLOUD_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: world-hub-fleet
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require the cloud secrets and variables
        run: packages/platform/bin/require.sh CLOUDFLARE_API_TOKEN NEON_API_KEY CLOUDFLARE_ACCOUNT_ID NEON_ORG_ID
      - uses: ./.github/actions/platform-setup
      - name: Bring up the fleet hub, or move its expiry
        run: packages/world/run.sh hub up --owner ci --lifetime "7 days"
  thin-line:
    needs: hub
    if: github.event_name == 'workflow_dispatch' || vars.CAPXUL_CLOUD_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require the cloud secrets and variables
        run: packages/platform/bin/require.sh CLOUDFLARE_API_TOKEN NEON_API_KEY CLOUDFLARE_ACCOUNT_ID NEON_ORG_ID
      - name: Require the world and the runner
        run: |
          missing=0
          for p in world runner; do
            if [ ! -f "packages/$p/package.json" ]; then
              echo "::error title=packages/$p has not landed::This job creates a world with packages/world and runs the thin line through packages/runner (roadmap steps 1.3, 1.2, 1.8); packages/$p is not on this branch yet."
              missing=1
            fi
          done
          exit "$missing"
      - uses: ./.github/actions/platform-setup
      - name: Name the world
        id: world
        # A world's name is the blueprint's WorldName: a-z first, then a-z, 0-9 and -, at most 15.
        run: echo "name=ci$(printf '%s' '${{ github.run_id }}' | tail -c 9)${{ github.run_attempt }}" >>"$GITHUB_OUTPUT"
      - name: Create the world
        run: packages/world/run.sh create "${{ steps.world.outputs.name }}" --owner ci --lifetime "2 hours"
      - name: Run the thin line's scenarios
        # PLUG-IN: the runner's documented command, once packages/runner lands (step 1.2).
        run: |
          mkdir -p "$RUNNER_TEMP/records"
          pnpm --filter @capxul/runner run scenarios -- --world "${{ steps.world.outputs.name }}" --records "$RUNNER_TEMP/records"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-${{ steps.world.outputs.name }}
          path: ${{ runner.temp }}/records/
          if-no-files-found: warn
      - name: Destroy the world
        if: always() && steps.world.outputs.name != ''
        run: packages/world/run.sh destroy "${{ steps.world.outputs.name }}"
      - name: Sweep worlds that outlived their expiry
        if: always() && steps.world.outputs.name != ''
        run: packages/world/run.sh sweep
