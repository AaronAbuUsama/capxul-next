# The ladder (AGENTS.md): rungs 1 to 5 on every pull request and on every push to master. Rung 6, the scenarios in a
# fresh world, is not here: it is world.yml. The job keeps the name `gate`, so the branch's history of checks stays
# readable. Foundry builds the contracts, whose compiled ABIs `pnpm generate:check` checks the generated files against
# (roadmap step 3.1), and `pnpm seed:check` rebuilds the seeded chain state with anvil and compares it with the
# committed one (3.2); forge's output and the compiler are cached by the contracts' sources.
name: check
on:
  pull_request:
  push:
    branches: [master]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway Postgres for packages/world's test/old-rows.test.ts: rows written by earlier code, moved by Core's
    # later migrations, must still read as the platform reads a world. No other test uses it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      CAPXUL_ROWS_DATABASE: postgres://postgres:pg@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache
            ~/.svm
          key: forge-v1.9.0-${{ hashFiles('packages/contracts/foundry.toml', 'packages/contracts/src/**', 'packages/contracts/lib/**', 'packages/contracts/test/mocks/**') }}
      # The gate's telemetry (roadmap 4.7): its run is a trace, each rung a span, sent to the staging collector. This
      # step alone holds the Cloudflare key, to read the platform's state as world.yml does; it mints this run's
      # collector token and hands the steps after it only the collector's address and the token, masked
      # (packages/runner, src/collector-env.entry.ts). It runs only where world.yml gets the key: on pushes to master
      # and on a slice's pull request; a builder's pull request into a slice exports nothing. A step that cannot find
      # the collector writes nothing: the gate then exports nothing and is judged all the same.
      - name: Find the collector
        if: github.event_name == 'push' || startsWith(github.head_ref, 'slice/')
        continue-on-error: true
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORLD_OWNER: ci-gate-${{ github.run_id }}
        run: node --experimental-strip-types --no-warnings packages/runner/src/collector-env.entry.ts
      # The rename ratchet R15 "Old words" (packages/blueprint/src/ratchets.ts; roadmap item 3.8) is gated by the climb's
      # last rung, `pnpm words`: no old word of the glossary may be written more often than its committed count, nor, on
      # a pull request, than the base branch's (GATE_WORDS_BASE), so a count raised by generating again fails.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
      # Rungs 1 to 5 in order, each a span (packages/lint, src/gate.entry.ts), stopping at the first that fails.
      - name: pnpm check
        env:
          GATE_WORDS_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: pnpm check
