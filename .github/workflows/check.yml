# The ladder (AGENTS.md): every rung runs on every pull request and on every push to master.
# The job keeps the name `gate`, so the branch's history of checks stays readable.
name: check
on:
  pull_request:
  push:
    branches: [master]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm shape
      - run: pnpm types
      - run: pnpm test
