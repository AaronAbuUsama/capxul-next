# The ladder (AGENTS.md): rungs 1 to 5 on every pull request and on every push to master. Rung 6, the scenarios in a
# fresh world, is not here: it is world.yml. The job keeps the name `gate`, so the branch's history of checks stays
# readable. Foundry builds the contracts, whose compiled ABIs `pnpm generate:check` checks the generated files against
# (roadmap step 3.1); its output and the compiler are cached by the contracts' sources.
name: check
on:
  pull_request:
  push:
    branches: [master]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - uses: actions/cache@v4
        with:
          path: |
            packages/contracts/out
            packages/contracts/cache
            ~/.svm
          key: forge-v1.9.0-${{ hashFiles('packages/contracts/foundry.toml', 'packages/contracts/src/**', 'packages/contracts/lib/**', 'packages/contracts/test/mocks/**') }}
      - run: pnpm shape
      - run: pnpm format:check
      - run: pnpm generate:check
      - run: pnpm lint
      - run: pnpm types
      - run: pnpm test
      - run: pnpm delta:check
