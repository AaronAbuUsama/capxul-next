name: "Defect"
description: "A defect task in the lane that owns the path: from a finding, a red integration head, a plan diagnosis, or a person."
title: "[defect:<lane>/<slug>] Defect: <the outcome to restore>"
labels: ["task", "kind:defect"]
body:
  - type: markdown
    attributes:
      value: |
        **A defect task** (`TaskDef`, kind defect: docs/design/swarm-templates.md section 8.1). capxul/master opens one for a finding outside its task's paths, for a red integration head, or for a blueprint change after a plan diagnosis; a person may open one too. It lives in the lane that owns the path, on that lane's branch, and never grows another task.

        - Its evals are existing eval ids that fail, error or are unknown at the head of integration/build, or that the finding names. A problem no eval catches is not a defect: name the `des:` of the operation it concerns, or raise a decision pack.
        - State what was observed, with ids and times, and why it matters.
  - type: input
    id: key
    attributes:
      label: "Key"
      description: "TaskDef.key: defect:<lane>/<slug> (kebab-case, at most 40 characters); a red head is defect:<lane>/head-<7 hex>."
      placeholder: "defect:devnet/board-executed-world"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      description: "TaskDef.kind, fixed by this form."
      options:
        - "defect"
      default: 0
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "TaskDef.goal: the outcome to restore, no steps: '<eval> passes again at integration/build: <one sentence>'. The title is 'Defect: <the outcome>'."
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Parent"
      description: "TaskDef.parent: lane:<lane>."
      placeholder: "lane:devnet"
    validations:
      required: true
  - type: input
    id: lane
    attributes:
      label: "Lane"
      description: "TaskDef.lane: the lane that owns the path (system.layout)."
      placeholder: "devnet"
    validations:
      required: true
  - type: input
    id: layer
    attributes:
      label: "Layer"
      description: "TaskDef.layer: that lane's layer."
      placeholder: "13"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "TaskDef.priority: critical for a red head and for an attack that lands on a money lane."
      options:
        - "critical"
        - "normal"
        - "low"
    validations:
      required: true
  - type: textarea
    id: evals
    attributes:
      label: "Evals"
      description: "TaskDef.evals: existing eval ids, at least one, one per line. They may also belong to a derived task."
      placeholder: "acc:payment.send/9"
    validations:
      required: true
  - type: textarea
    id: needs
    attributes:
      label: "Needs"
      description: "TaskDef.needs: task keys it waits on, one per line, or _none_."
      placeholder: "_none_"
    validations:
      required: true
  - type: textarea
    id: labels
    attributes:
      label: "Labels"
      description: "TaskDef.labels: kind:defect, lane:<lane>, layer:<n>, money on a money lane, and one of from:finding, from:red-head, from:person, book-change."
      placeholder: |
        kind:defect
        lane:devnet
        layer:13
        from:finding
    validations:
      required: true
  - type: input
    id: budgetUsd
    attributes:
      label: "Budget (USD)"
      description: "TaskDef.budgetUsd: 5."
      placeholder: "5"
    validations:
      required: true
  - type: dropdown
    id: checkers
    attributes:
      label: "Checkers"
      description: "TaskDef.checkers: the reviewer; the adversary too on a money lane."
      options:
        - "reviewer"
        - "adversary"
      multiple: true
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: "Paths"
      description: "TaskDef.paths: the owning lane's paths, one prefix per line."
      placeholder: "packages/devnet/"
    validations:
      required: true
  - type: input
    id: record
    attributes:
      label: "Record"
      description: "TaskDef.record: the record it restores, if one."
      placeholder: "operation:payment.send"
    validations:
      required: false
  - type: textarea
    id: decisions
    attributes:
      label: "Decisions"
      description: "brief.decisions: decision ids that settle it, one per line."
    validations:
      required: false
  - type: textarea
    id: outOfScope
    attributes:
      label: "Out of scope"
      description: "brief.outOfScope: one per line, or _none_."
      placeholder: "_none_"
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "brief.context: first line 'From: <F-n on P-n at <7 hex> | head regression at <7 hex> after <task keys> | @<login>>'; then what was observed, with ids and times, and why it matters. At most 4,000 characters."
      placeholder: |
        From: F-15 on P-44 at e7f8a9b
        acc:payment.send/9 is unverifiable because the world board-executed is missing (verdict V-9012, 2026-11-20T14:02Z).
    validations:
      required: true
