name: "Task card: review"
description: "Opened by capxul/master from a review answer or a resolved matter. Not for people: use Review answer."
title: "[review:<decision>] Review: <decision>: <accept | choose <option> | change>"
labels: ["task", "kind:review"]
body:
  - type: markdown
    attributes:
      value: |
        **A review task** (`TaskDef`, kind review: docs/design/swarm-templates.md section 8.2). capxul/master opens it, critical, from a review answer or a resolved matter, and it is taken before any other work (swarm.review-answers). Its pair changes the decision record first, then every record the answer ripples to, on review/<decision>; code changes later, through the lanes the plan reopens. People do not open it: answer with the Review answer form.
  - type: input
    id: key
    attributes:
      label: "Key"
      description: "TaskDef.key: review:<decision>, or review:surface."
      placeholder: "review:payments.birth-width"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      description: "TaskDef.kind, fixed by this form."
      options:
        - "review"
      default: 0
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: "Goal"
      description: "TaskDef.goal: 'Decision <id> records the answer of #<issue> (seen at <7 hex>), and every record it ripples to says the same; the book builds to 0 problems and check-frozen reports 0 breaches.'"
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: "Parent"
      description: "TaskDef.parent."
      value: "capxul"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: "Priority"
      description: "TaskDef.priority: always critical."
      options:
        - "critical"
      default: 0
    validations:
      required: true
  - type: textarea
    id: evals
    attributes:
      label: "Evals"
      description: "TaskDef.evals: dec:<decision>/review (swarm.hand-tasks). Until the book derives it, Mission Control counts the task done at its merge."
      placeholder: "dec:payments.birth-width/review"
    validations:
      required: true
  - type: textarea
    id: labels
    attributes:
      label: "Labels"
      description: "TaskDef.labels."
      placeholder: "kind:review"
    validations:
      required: true
  - type: input
    id: budgetUsd
    attributes:
      label: "Budget (USD)"
      description: "TaskDef.budgetUsd: 5."
      placeholder: "5"
    validations:
      required: true
  - type: dropdown
    id: checkers
    attributes:
      label: "Checkers"
      description: "TaskDef.checkers: the reviewer confirms the records say what the answer says."
      options:
        - "reviewer"
      default: 0
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: "Paths"
      description: "TaskDef.paths: the book folders of the decision and the records it ripples to; docs/decisions/accepted-surface.json for surface."
      placeholder: "books/target/payments/"
    validations:
      required: true
  - type: input
    id: record
    attributes:
      label: "Record"
      description: "TaskDef.record: the decision record."
      placeholder: "decision:payments.birth-width"
    validations:
      required: true
  - type: input
    id: answer-issue
    attributes:
      label: "Answer issue"
      description: "The review-answer issue or the resolved matter it carries."
      placeholder: "#88"
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: "Decision"
      description: "ReviewAnswer.decision."
      placeholder: "payments.birth-width"
    validations:
      required: true
  - type: dropdown
    id: answer
    attributes:
      label: "Answer"
      description: "ReviewAnswer.answer."
      options:
        - "accept"
        - "choose"
        - "change"
    validations:
      required: true
  - type: input
    id: option
    attributes:
      label: "Option"
      description: "ReviewAnswer.option: for choose."
    validations:
      required: false
  - type: textarea
    id: text
    attributes:
      label: "Text"
      description: "ReviewAnswer.text: for change, the reviewer's own words, verbatim."
    validations:
      required: false
  - type: input
    id: seenAt
    attributes:
      label: "Seen at"
      description: "ReviewAnswer.seenAt: the commit the reviewer read. If the record changed after it, ask before applying."
    validations:
      required: true
  - type: input
    id: by
    attributes:
      label: "By"
      description: "ReviewAnswer.by: the answer issue's author (a GitHub login), who must be the decision's reviewer."
    validations:
      required: true
  - type: input
    id: at
    attributes:
      label: "At"
      description: "ReviewAnswer.at: when it was answered, ISO 8601 UTC."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Context"
      description: "brief.context: the records the answer ripples to and the operations it held, from the portal's page."
    validations:
      required: false
