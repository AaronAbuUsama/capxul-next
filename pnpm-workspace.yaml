# pnpm workspaces (decision tooling.package-manager: Aaron, 8 November 2026 — pnpm, not npm).
packages:
  - packages/*

# One version of each shared dependency; manifests refer to it as "catalog:".
catalog:
  effect: 4.1.2
  typescript: 5.9.3
  "@types/node": 22.19.1
  viem: 2.55.18

# Supply chain: a version must be at least 3 days old, and no dependency runs an install script
# unless it is listed here.
minimumReleaseAge: 4320
onlyBuiltDependencies: []

savePrefix: ""
packageImportMethod: clone-or-copy

# Install scripts of these are known and deliberately NOT run (pi-ai pulls them in; neither is needed at run time).
allowBuilds:
  "@google/genai": false
  protobufjs: false
  # alto (packages/devnet's bundler) pulls it in; msgpackr falls back to plain JavaScript without it.
  msgpackr-extract: false
patchedDependencies:
  '@pimlico/alto@0.0.21': packages/devnet/patches/@pimlico__alto@0.0.21.patch
