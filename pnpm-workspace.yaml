# pnpm workspaces (decision tooling.package-manager: Aaron, 8 November 2026: pnpm, not npm).
packages:
  - packages/*

# One version of each shared dependency; manifests refer to it as "catalog:".
catalog:
  effect: 4.1.2
  typescript: 5.9.3
  "@types/node": 22.19.1
  viem: 2.55.18
  # The ladder's tools, each published at least two weeks before 13 November 2026. @effect/tsgo 0.63.0 supports
  # oxlint 1.88 to 1.90 and oxlint-tsgolint 7.0.2004 and 7.0.2005 (its README), so these move together.
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  oxfmt: 0.75.0
  "@oxlint/plugins": 1.90.0
  "@effect/tsgo": 0.63.0
  # Core's Worker and the runner's stages: Alchemy 2.0.0-beta.85 on Effect 4.1.2, the pair the pipeline spike
  # proved (published 2 November 2026). The platform packages are Effect's own, at effect's version: Bun for the
  # runner; Node for the CLI's process (stdin, stdout, exit code) and the SDK's tests' HTTP server.
  alchemy: 2.0.0-beta.85
  "@alchemy.run/cloudflare": 2.0.0-beta.85
  "@alchemy.run/neon": 2.0.0-beta.85
  "@alchemy.run/sql": 2.0.0-beta.85
  "@effect/sql-pg": 4.1.2
  "@effect/platform-bun": 4.1.2
  "@effect/platform-node": 4.1.2
  "@cloudflare/workers-types": 4.20260702.1
  "@types/bun": 1.4.4

# Supply chain: a version must be at least 3 days old, and no dependency runs an install script
# unless it is listed here.
minimumReleaseAge: 4320
onlyBuiltDependencies: []
# Denied, not merely skipped, so an install does not stop on them. workerd's script only checks the binary that
# Alchemy's local runtime uses; worlds run on Cloudflare, never on this machine.
allowBuilds:
  workerd: false

savePrefix: ""
packageImportMethod: clone-or-copy
