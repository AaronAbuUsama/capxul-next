<!--
  Rebuild Sitrep, v3 design. It holds no data. Everything it shows comes from the artifact's database
  (schema in the sitrep skill's SKILL.md on design/sitrep):
    sitrep/numbers  milestones, the next milestone's steps, burn-down, plan totals   written by numbers.py
    sitrep/now      needs you, master, run, lanes, landed, threads                   written by the conductor
    sitreps/<id>    one spoken update each                                           written by the conductor
    data/users/<viewer>/sitrep-prefs   what this viewer has heard, and their reading speed
-->
<style>
/* Layout: phone = one column, large titles, five-tab bar, pushed detail pages, mini player above the tabs.
   Laptop (>= 980px) = sidebar of the five tabs, the tab's list in the middle, the detail in a right panel. */

  --idle: #8b93a3; --idle-soft: #eef0f3; --bar: rgba(249,249,251,.9); --shadow: rgba(10,14,20,.28); --on-bad: #ffffff;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Geist", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #1c1c1e; --sunk: #2c2c2e; --fg: #f2f2f7; --muted: #9a9aa1; --line: #38383a;
  --accent: #8796ff; --accent-soft: #23295a; --on-accent: #0b0e13;
  --ok: #55cf8f; --ok-soft: #13291e; --warn: #f0a854; --warn-soft: #33250f; --bad: #f07a7a; --bad-soft: #3a1a1b;
  --idle: #7c8596; --idle-soft: #26262a; --bar: rgba(22,22,24,.9); --shadow: rgba(0,0,0,.6); --on-bad: #ffffff; color-scheme: dark; } }
:root[data-theme="dark"] {

  --accent: #8796ff; --accent-soft: #23295a; --on-accent: #0b0e13;
  --ok: #55cf8f; --ok-soft: #13291e; --warn: #f0a854; --warn-soft: #33250f; --bad: #f07a7a; --bad-soft: #3a1a1b;
  --idle: #7c8596; --idle-soft: #26262a; --bar: rgba(22,22,24,.9); --shadow: rgba(0,0,0,.6); --on-bad: #ffffff; color-scheme: dark; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(100px + env(safe-area-inset-bottom, 0px)); }

/* chart */

  display: flex; justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }

<script>
(function () {
  "use strict";
  if (!window.preact || !window.preactHooks || !window.htm) { document.getElementById("root").innerHTML = '<p class="loading">The page could not load its scripts. Reload to try again.</p>'; return; }
  var h = preact.h, render = preact.render, H = preactHooks, html = htm.bind(h);
  var useState = H.useState, useEffect = H.useEffect, useRef = H.useRef;

  // ---------- state ----------
  var S = { numbers: null, now: null, reps: [], heard: {}, rate: 1, open: {}, loaded: false, notice: "", voiceNote: "" };
  var P = { queue: [], cur: -1, state: "idle", posMs: 0 };
  var tts = null, prefsRef = null, prefsTimer = null, bump = function () {};
  var SPEEDS = [0.8, 1, 1.25, 1.5];
  function arr(x) { return Array.isArray(x) ? x : []; }
  function safeHref(h2) { return typeof h2 === "string" && /^https:\/\//.test(h2) ? h2 : null; }
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function pad(n) { return String(n).padStart(2, "0"); }
  function hm(t) { var d = new Date(t); return isNaN(d) ? "" : pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()); }
  function dayKey(t) { var d = new Date(t); return isNaN(d) ? "" : d.toISOString().slice(0, 10); }
  function dayName(t) {
    var k = dayKey(t), today = new Date().toISOString().slice(0, 10), y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    if (k === today) return "Today"; if (k === y) return "Yesterday";
    var d = new Date(t); return DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()];
  }
  function short(t) { return dayKey(t) === new Date().toISOString().slice(0, 10) ? hm(t) : dayName(t) + " " + hm(t); }
  function stamp(t) { var d = new Date(t); return isNaN(d) ? "" : DAYS[d.getUTCDay()] + " " + d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + ", " + hm(t) + " UTC"; }
  function ago(t) { var m = Math.round((Date.now() - Date.parse(t)) / 6e4); if (isNaN(m)) return ""; return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 1440 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many || one + "s"); }
  function stateDot(s) {
    s = String(s || "").toLowerCase();
    return s === "done" || s === "merged" || s === "green" ? "d-ok" : s === "in progress" || s === "building" || s === "claimed" ? "d-warn" : s === "proving" || s === "checks running" || s === "running" ? "d-acc" : s === "broken" || s === "checks failed" || s === "red" ? "d-bad" : "";
  }
  function stateChip(s) { return { "d-ok": "c-ok", "d-warn": "c-warn", "d-acc": "c-acc", "d-bad": "c-bad" }[stateDot(s)] || ""; }
  function isDone(s) { return String(s || "").toLowerCase() === "done"; }

  // ---------- derived data ----------
  function latestAt() { return [S.now && S.now.at, S.numbers && S.numbers.builtAt].filter(Boolean).sort().pop(); }
  function lanes() { return arr(S.now && S.now.lanes); }
  function laneById(id) { return lanes().filter(function (l) { return l.id === id; })[0]; }
  function milestones() { return arr(S.numbers && S.numbers.milestones); }
  function curMilestone() { return S.numbers && S.numbers.milestone; }
  function milestoneById(id) { return milestones().filter(function (m) { return m.id === id; })[0]; }
  function stepIndex() {
    // The roadmap's steps for the next milestone (numbers.py), plus every step a lane carries (the conductor).
    var out = {}, ms = curMilestone();
    if (ms) arr(ms.steps).forEach(function (s) { out[s.id] = { id: s.id, name: s.name, state: s.state, m: ms.id, roadmap: true }; });
    lanes().forEach(function (l) { arr(l.steps).forEach(function (s) {
      var x = out[s.id]; if (!x) x = out[s.id] = { id: s.id, name: s.name, state: s.state, m: String(s.id).split(".")[0] };
      x.lane = l.id; x.laneState = s.state; if (!x.roadmap) x.state = s.state;
    }); });
    return out;
  }
  function unheard() { return S.reps.filter(function (r) { return !S.heard[r.id]; }); }
  function runGauge() {
    var r = S.now && S.now.run; if (!r || r.minutes == null) return null;
    var g = lanes().map(function (l) { return l.gauge; }).filter(function (x) { return x && x.unit === "min" && x.max; })[0];

  // ---------- small pieces ----------
  function Row(p) {

        ${days.map(function (t) { return html`<line x1=${X(t)} x2=${X(t)} y1=${T} y2=${T + ph} stroke="var(--line)" stroke-dasharray="2 3"/>${X(t) + 30 < W - R ? html`<text x=${X(t) + 4} y=${H2 - 6}>${DAYS[new Date(t).getUTCDay()]}</text>` : null}`; })}

        ${tip ? html`<line x1=${X(tip.t)} x2=${X(tip.t)} y1=${T} y2=${T + ph} stroke="var(--muted)"/><circle cx=${X(tip.t)} cy=${Y(tip.left)} r="5.5" fill="none" stroke="var(--fg)" stroke-width="2"/>` : null}
      </svg>
      ${tip ? html`<div class="tip" style=${"left:" + Math.max(0, Math.min(W - 220, X(tip.t) + 10)) + "px"}><b>${stamp(tip.t)}</b>${tip.left} left${tip.total ? " · " + tip.done + " of " + tip.total + " done" : ""}${tip.note ? html`<br/>${tip.note}` : null}</div>` : null}

  }
  function BurnCard(p) {

  // ---------- Now ----------
  function NowView(p) {

  // ---------- Plan ----------
  function PlanView(p) {
    var num = S.numbers, cur = curMilestone(), ms = milestones();

  // ---------- Lanes ----------

  // ---------- Measures ----------

          <div class="btns">${g.state ? html`<span class=${"chip " + stateChip(g.state)}>last run ${g.state === "green" ? "passed" : g.state === "red" ? "failed" : g.state}</span>` : null}
            ${safeHref(g.href) ? html`<a class="sub" href=${g.href} target="_blank" rel="noopener">The run's record ↗</a>` : html`<span class="sub">No run record linked yet.</span>`}
            ${g.lane ? html`<button class="btn ghost" type="button" onClick=${function () { p.go("lanes", [{ t: "lane", id: g.lane.id }]); }}>Open the ${g.lane.name} lane</button>` : null}</div>
        </div>` : html`<${Waiting} text="No full run has been measured yet."/>`}<//>
      <${Sec} h="The plan">${pl && pl.total ? html`<div class="card"><div class="stats">
          <div><b>${Math.round(100 * pl.done / pl.total)}%</b><span>${pl.done} of ${pl.total} units done</span></div>
          <div><b>${td.done != null ? td.done : "–"}</b><span>units done today</span></div>
          <div><b>${td.added != null ? td.added : "–"}</b><span>units added today</span></div></div></div>
        <${BurnCard} head=${false}/>` : html`<${Waiting} text="The plan's totals appear once the roadmap's numbers are written."/>`}<//>
      <${Sec} h="Ratchets" hr="may only fall"><div class="card pending"><b>No counts in the sitrep yet</b><span class="sub">Each ratchet's list may only shrink. The counts will show here, with their trend, once the sitrep's numbers carry them.</span></div><//>
      <${Sec} h="Budgets"><div class="card pending"><b>No operation measured against a budget yet</b><span class="sub">Every operation's budget is provisional until a run records it. The full run above is the only measured target so far.</span></div><//>
      <${Sec} h="Evals"><div class="group">
        <${Row} dot="d-none" title="Explainability" sub="Scored from run records, roadmap step 4.2" right="not yet"/>
        <${Row} dot="d-none" title="Tries to green, breakage and recovery" sub="The build trends, roadmap step 4.3" right="not yet"/>
        <${Row} dot="d-none" title="Coverage of declared moves" sub="The coverage report, roadmap step 3.7" right="not yet"/></div><//>
    </div>`;
  }

  // ---------- Sitreps ----------
  var PLAY = html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`;
  var PAUSE = html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>`;
  var STOP = html`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>`;
  function curLine() { return P.cur >= 0 ? P.queue[P.cur] : null; }
  function playingRep() { var c = curLine(); return P.state !== "idle" && c ? c.rid : null; }
  function RepItem(p) {
    var r = p.r, key = (p.scope || "") + r.id, open = key in S.open ? S.open[key] : !!p.defaultOpen, heard = !!S.heard[r.id], playing = playingRep() === r.id, c = curLine();
    var paras = arr(r.paras);
    function toggleOpen() { S.open[key] = !open; bump(); }
    return html`<div class=${"rep " + (heard ? "heard" : "new") + (playing ? " playing" : "")}>
      <div class="rhead">
        <i class=${"dot " + (playing || !heard ? "d-acc" : "")}></i>
        <button class="rtog" type="button" aria-expanded=${open ? "true" : "false"} onClick=${toggleOpen}><span class="tt">${r.title}</span>
          <span class="meta">${short(r.at)} · ${plural(paras.length, "part")}${playing ? " · playing" : heard ? " · heard" : ""}</span></button>
        ${tts ? html`<button class="pl" type="button" aria-label=${(playing ? "Stop " : "Play ") + r.title} onClick=${function () { if (playing) stopReading(); else startReading([r], 0); }}>${playing ? STOP : PLAY}</button>` : html`<span class="chev" aria-hidden="true"></span>`}
      </div>
      ${open ? html`<div class="body">${paras.map(function (t, i) { return html`<p class=${"part" + (tts ? " speak" : "") + (playing && c && c.p === i ? " on" : "")} title=${tts ? "Play from here" : null} onClick=${tts ? function () { startReading([r], i); } : null}>${t}</p>`; })}
        <div class="btns">${tts ? html`<button class="btn" type="button" onClick=${function () { if (playing) toggle(); else startReading([r], 0); }}>${playing && P.state === "speaking" ? PAUSE : PLAY} ${playing ? (P.state === "paused" ? "Resume" : "Pause") : heard ? "Play again" : "Play"}</button>` : null}
          <button class="btn ghost" type="button" onClick=${function () { setHeard(r.id, !heard); }}>${heard ? "Mark new" : "Mark heard"}</button></div>
        ${arr(r.links).filter(function (l) { return safeHref(l && l.href); }).length ? html`<div class="links">${r.links.filter(function (l) { return safeHref(l && l.href); }).map(function (l, i) { return html`<a key=${i} href=${l.href} target="_blank" rel="noopener">${l.label}</a>`; })}</div>` : null}</div>` : null}
    </div>`;
  }
  function RepsView(p) {
    var fresh = unheard(), old = S.reps.filter(function (r) { return S.heard[r.id]; }), groups = [];
    old.forEach(function (r) { var dn = dayName(r.at), g = groups[groups.length - 1]; if (!g || g.day !== dn) groups.push(g = { day: dn, reps: [] }); g.reps.push(r); });
    var reading = P.state !== "idle";
    return html`<div class="page"><${Title} title="Sitreps" asof=${true}/><${Notice}/>
      ${S.reps.length ? html`<div class="btns">
        ${tts ? html`<button class="btn" type="button" onClick=${function () { if (reading) { toggle(); return; } startReading((fresh.length ? fresh : S.reps.slice(0, 1)).slice().reverse(), 0); }}>${reading && P.state === "speaking" ? PAUSE : PLAY} ${reading ? (P.state === "paused" ? "Resume" : "Pause") : fresh.length ? "Play " + fresh.length + " new" : "Play the latest"}</button>` : null}
        ${fresh.length ? html`<button class="btn ghost" type="button" onClick=${function () { S.reps.forEach(function (r) { S.heard[r.id] = true; }); savePrefs(); bump(); }}>Mark all heard</button>` : null}</div>` : null}
      <p class="note">${S.voiceNote || (tts ? "Short spoken updates from the conductor, newest first. Tap one to read it; tap a paragraph to play from there." : "Short updates from the conductor, newest first.")}</p>
      ${!S.reps.length ? html`<${Waiting} text=${S.loaded ? "No sitreps yet. The conductor adds one after each merge, decision or new thread." : "Loading…"}/>`
        : fresh.length ? html`<${Sec} h=${"Not heard · " + fresh.length}><div class="group">${fresh.map(function (r) { return html`<${RepItem} key=${r.id} r=${r} scope="feed-" ctx=${p}/>`; })}</div><//>` : html`<p class="sub">You're up to date.</p>`}
      ${groups.map(function (g) { return html`<${Sec} key=${g.day} h=${"Heard · " + g.day}><div class="group">${g.reps.map(function (r) { return html`<${RepItem} key=${r.id} r=${r} scope="feed-" ctx=${p}/>`; })}</div><//>`; })}
    </div>`;
  }

  // ---------- heard and speed, per viewer ----------
  function savePrefs() {
    try { localStorage.setItem("sitrep-prefs", JSON.stringify({ heard: S.heard, rate: S.rate })); } catch (e) {}
    if (!prefsRef) return;
    clearTimeout(prefsTimer);
    prefsTimer = setTimeout(function () { prefsRef.set({ heard: S.heard, rate: S.rate }).catch(function () {}); }, 600);
  }
  function setHeard(id, on) { if (on) S.heard[id] = true; else delete S.heard[id]; savePrefs(); bump(); }
  try { var lp = JSON.parse(localStorage.getItem("sitrep-prefs") || "null"); if (lp) { S.heard = lp.heard || {}; S.rate = SPEEDS.indexOf(lp.rate) >= 0 ? lp.rate : 1; } } catch (e) {}

  // ---------- the player ----------
  // A reading is a queue of paragraphs, one tts line each. Back, forward and the segment bar start a new reading
  // from another paragraph (the platform's voice has no seek inside a paragraph).
  function startReading(reps, fromPara) {
    if (!tts) return;
    var q = [];
    reps.forEach(function (r) { arr(r.paras).forEach(function (t, i) { q.push({ rid: r.id, p: i, n: r.paras.length, title: r.title, text: (i === 0 ? r.title + ". " : "") + t }); }); });
    if (!q.length) return;
    P.queue = q; speakFrom(fromPara || 0);
  }
  function speakFrom(i) {
    if (!tts || i < 0 || i >= P.queue.length) return;
    P.cur = i; P.state = "starting"; P.posMs = 0; bump();
    var lines = P.queue.slice(i).map(function (l, k) { return { text: l.text, id: String(i + k) }; });
    tts.speak(lines, { rate: S.rate }).catch(function (err) {
      if (err && err.code === "stopped") return;
      if (err && (err.code === "not_granted" || err.code === "unavailable")) { tts = null; S.voiceNote = "Reading aloud is off for this page. Turn it on in the page's Permissions menu."; }
      else if (err && err.code === "rate_limited") S.voiceNote = "Reading aloud is busy for now. Try again in a minute.";
      P.state = "idle"; P.cur = -1; bump();
    });
  }
  function toggle() {
    if (!tts) return;
    if (P.state === "paused") { tts.resume().catch(function () {}); }
    else if (P.state !== "idle") { tts.pause().catch(function () {}); }
  }
  function stopReading() { if (tts) tts.stop().catch(function () {}); }
  function back() { if (P.cur < 0) return; speakFrom(P.posMs > 3000 || P.cur === 0 ? P.cur : P.cur - 1); }
  function forward() { if (P.cur < 0) return; if (P.cur + 1 < P.queue.length) speakFrom(P.cur + 1); else stopReading(); }
  function setSpeed() {
    var i = SPEEDS.indexOf(S.rate); S.rate = SPEEDS[(i + 1) % SPEEDS.length];
    if (tts && tts.setRate) Promise.resolve(tts.setRate(S.rate)).catch(function () {});
    savePrefs(); bump();
  }
  function onLine(ev) {
    var i = Number(ev.id); if (isNaN(i) || !P.queue[i]) return;
    var prev = curLine(); P.cur = i; P.posMs = 0;
    if (prev && prev.rid !== P.queue[i].rid) S.heard[prev.rid] = true;
    if (P.queue[i].p === P.queue[i].n - 1) S.heard[P.queue[i].rid] = true;
    savePrefs(); bump();
  }
  function onState(ev) {
    if (ev.state === "idle") { if (ev.reason === "replaced") return; P.state = "idle"; P.cur = -1; bump(); return; }
    P.state = ev.state === "starting" ? "speaking" : ev.state; bump();
  }
  function Mini() {
    var c = curLine(), on = P.state !== "idle" && !!c;
    if (!on) return null;
    var rids = []; P.queue.forEach(function (l) { if (rids.indexOf(l.rid) < 0) rids.push(l.rid); });
    var paused = P.state === "paused";
    return html`<div class=${"mini" + (P.state === "speaking" ? " speaking" : "")} role="region" aria-label="Now playing">
      <div class="top"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="t"><b>${c.title}</b><small>part ${c.p + 1} of ${c.n}${rids.length > 1 ? " · sitrep " + (rids.indexOf(c.rid) + 1) + " of " + rids.length : ""}${paused ? " · paused" : ""}</small></span>
        <button class="ic" type="button" aria-label="Stop" onClick=${stopReading}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button></div>
      <div class="segs" aria-label="Jump to a part">${P.queue.map(function (l, i) { return html`<button type="button" aria-label=${"Play " + l.title + ", part " + (l.p + 1)} class=${(i < P.cur ? "past" : i === P.cur ? "cur" : "") + (l.p === 0 && i > 0 ? " rep" : "")} onClick=${function () { speakFrom(i); }}><i></i></button>`; })}</div>
      <div class="ctl"><button class="speed" type="button" aria-label="Reading speed" onClick=${setSpeed}>${S.rate}×</button>
        <span style="display:flex;gap:6px">
          <button class="ic" type="button" aria-label="Back" onClick=${back}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
          <button class="ic main" type="button" aria-label=${paused ? "Resume" : "Pause"} onClick=${toggle}>${paused ? PLAY : PAUSE}</button>
          <button class="ic" type="button" aria-label="Forward" onClick=${forward}><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button></span>
        <span style="width:52px" aria-hidden="true"></span></div></div>`;
  }
  document.addEventListener("keydown", function (e) {
    if (P.state === "idle" || (e.target.closest && e.target.closest("input, textarea"))) return;
    if (e.key === " " && !(e.target.closest && e.target.closest("button, a"))) { e.preventDefault(); toggle(); }
    else if (e.key === "ArrowLeft" && e.altKey) back(); else if (e.key === "ArrowRight" && e.altKey) forward();
  });

  // ---------- the app ----------
  var TABS = [
    ["now", "Now", "M12 3v3M12 18v3M3 12h3M18 12h3M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8"],
    ["plan", "Plan", "M4 6h16M4 12h10M4 18h6"],
    ["lanes", "Lanes", "M6 3v18M12 3v18M18 3v18"],
    ["measures", "Measures", "M4 20V10M10 20V4M16 20v-7M22 20H2"],
    ["reps", "Sitreps", "M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"]
  ];
  var ROOT = { now: NowView, plan: PlanView, lanes: LanesView, measures: MeasuresView, reps: RepsView };
  var DETAIL = { milestone: MilestoneView, step: StepView, lane: LaneView };
  var savedTab = "now"; try { var st = localStorage.getItem("sitrep-tab3"); if (ROOT[st]) savedTab = st; } catch (e) {}
  function App() {
    var tick = useState(0); bump = function () { tick[1](function (n) { return n + 1; }); };
    var tab = useState(savedTab), stacks = useState({ now: [], plan: [], lanes: [], measures: [], reps: [] });
    var wide = useState(window.matchMedia("(min-width: 980px)").matches);
    useEffect(function () { var mq = window.matchMedia("(min-width: 980px)"), f = function () { wide[1](mq.matches); }; if (mq.addEventListener) mq.addEventListener("change", f); return function () { if (mq.removeEventListener) mq.removeEventListener("change", f); }; }, []);
    useEffect(function () { try { localStorage.setItem("sitrep-tab3", tab[0]); } catch (e) {} }, [tab[0]]);
    var playing = P.state !== "idle" && !!curLine();
    useEffect(function () { document.body.classList.toggle("playing", playing); }, [playing]);
    var stack = stacks[0][tab[0]];
    function push(v) { var s = Object.assign({}, stacks[0]); s[tab[0]] = stack.concat([v]); stacks[1](s); if (!wide[0]) window.scrollTo(0, 0); }
    function pop() { var s = Object.assign({}, stacks[0]); s[tab[0]] = stack.slice(0, -1); stacks[1](s); }
    function go(t, st2) { var s = Object.assign({}, stacks[0]); s[t] = st2; stacks[1](s); tab[1](t); window.scrollTo(0, 0); }
    var ctx = { push: push, go: go };
    var badges = { now: arr(S.now && S.now.needsYou).length, reps: unheard().length };
    var Root = ROOT[tab[0]], top = stack[stack.length - 1], Detail = top && DETAIL[top.t];
    var detail = Detail ? html`<div class="panel"><button class="back" type="button" onClick=${pop}>${stack.length > 1 ? "Back" : wide[0] ? "Close" : TABS.filter(function (t) { return t[0] === tab[0]; })[0][1]}</button><${Detail} key=${top.t + top.id} id=${top.id} ...${ctx}/></div>` : null;
    var at = latestAt();
    var bar = html`<${TabBar} tab=${tab} stacks=${stacks} badges=${badges}/>`;
    return html`
      <div class=${"app" + (wide[0] && !detail ? " single" : "")}>
        ${wide[0] ? html`<div class="side"><div class="brand"><b>Rebuild sitrep</b><span>${at ? "Updated " + hm(at) + " UTC" : S.loaded ? "No updates yet" : "Loading…"}</span></div>${bar}</div><${Root} ...${ctx}/>${detail}`
          : html`<div>${detail || html`<${Root} ...${ctx}/>`}</div>`}
      </div>
      ${wide[0] ? null : bar}
      <${Mini}/>`;
  }
  function TabBar(p) {
    return html`<nav class="tabbar" aria-label="Sections">${TABS.map(function (t) {
      var on = p.tab[0] === t[0], n = p.badges[t[0]];
      return html`<button class="tab" type="button" aria-current=${on ? "page" : null} onClick=${function () { if (on) { var s = Object.assign({}, p.stacks[0]); s[t[0]] = []; p.stacks[1](s); } p.tab[1](t[0]); window.scrollTo(0, 0); }}>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d=${t[2]}/></svg>${t[1]}${n ? html`<span class="badge" aria-label=${n + " new"}>${n}</span>` : null}</button>`; })}</nav>`;
  }

  // ---------- data ----------
  function sortReps(list) { return list.filter(function (r) { return r && r.id && r.title; }).sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); }); }
  function connect(src) {
    // src: { db, user } -- the platform's namespaces, or a fixture in tests.
    var db = src.db, timer = setTimeout(function () { S.notice = "The sitrep's data can't be reached yet. What you see may be out of date."; bump(); }, 10000);
    function fresh(snap) { if (!snap.fromCache) { clearTimeout(timer); S.notice = ""; } S.loaded = true; }
    function fail() { clearTimeout(timer); S.notice = "The sitrep's data stopped updating. Reload the page to try again."; bump(); }
    db.doc("sitrep/numbers").onSnapshot(function (s) { S.numbers = s.exists ? s.data() : null; fresh(s); bump(); }, fail);
    db.doc("sitrep/now").onSnapshot(function (s) { S.now = s.exists ? s.data() : null; fresh(s); bump(); }, fail);
    db.collection("sitreps").orderBy("at", "desc").limit(60).onSnapshot(function (q) {
      S.reps = sortReps(q.docs.map(function (d) { var x = d.data() || {}; x.id = d.id; return x; })); fresh(q); bump();
    }, fail);
    if (src.user) src.user.id().then(function (uid) {
      if (!uid) return;
      prefsRef = db.doc("data/users/" + uid + "/sitrep-prefs");
      prefsRef.onSnapshot(function (s) {
        if (!s.exists) return; var d = s.data() || {};
        Object.keys(d.heard || {}).forEach(function (k) { S.heard[k] = true; });
        if (d.rate && SPEEDS.indexOf(d.rate) >= 0) S.rate = d.rate;
        bump();
      }, function () { prefsRef = null; });
    }).catch(function () {});
  }
  function useVoice(t) {
    tts = t;
    if (!t) { S.voiceNote = "Reading aloud isn't available in this view (Safari, the mobile app, or outside the organization), so each sitrep is written out when you open it."; bump(); return; }
    S.voiceNote = "";
    if (t.setRate) Promise.resolve(t.setRate(S.rate)).catch(function () {});
    t.onLine(onLine); t.onState(onState); if (t.onPosition) t.onPosition(function (e) { P.posMs = e.ms; });
    bump();
  }
  window.SitrepPage = { connect: connect, useVoice: useVoice }; // for a test harness
  var root = document.getElementById("root"); root.innerHTML = "";
  render(html`<${App}/>`, root);
  if (window.claude && window.claude.use) {
    Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("tts")]).then(function (ns) {
      if (ns[0]) connect({ db: ns[0], user: ns[1] }); else { S.loaded = true; S.notice = "Sign in to claude.ai to see the sitrep's data."; bump(); }
      useVoice(ns[2]);
    });
  } else { S.loaded = true; bump(); }
})();
</script>
