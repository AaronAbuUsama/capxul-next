AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated company-sites worker (Frappe bench, Capxul service, test chain, record); does not modify Capxul, Paynest or the tools worker.

# DRAFT. Not deployed. Modelled on deploy/tools/template.yaml in Xelmar-tech/hosting (origin/main, 14 Oct 2026).
# "Same" below means identical to that file. Every difference is marked DIFFERS with the reason.
# No secret is in this file. The SSH public key is public by nature; MariaDB and application secrets are placed
# on the machine afterwards, under /etc/capxul/env/sites (see secrets handling in deploy/openship/secrets.md).

Parameters:
  AvailabilityZone:
    Type: String
    Default: eu-west-1a            # same
  BlueprintId:
    Type: String
    Default: ubuntu_24_04          # same
  KeyPairName:
    Type: String                   # same
  SshPublicKeyBase64:
    Type: String                   # same
  OperatorCidr:
    Type: String
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'   # same
  ControllerPublicCidr:
    Type: String
    Default: 99.81.80.126/32       # same (the controller's public address, as in the precedent)
    AllowedPattern: '(\d{1,3}\.){3}\d{1,3}/32'
  # DIFFERS: the precedent hard-codes names and size. The owner asked for size and names as parameters.
  InstanceName:
    Type: String
    Default: sites-worker-ireland
  StaticIpName:
    Type: String
    Default: sites-worker-ireland-ip
  BundleId:
    Type: String
    Default: xlarge_3_0            # 16 GiB, 4 vCPU, 320 GB, $84/month: read from deploy/tools/split-2026-10-02.md
    AllowedValues: [large_3_0, xlarge_3_0]   # large_3_0 = 8 GiB, $44/month (deploy/tools/split-2026-10-02.md). Too small for a bench plus MariaDB; kept for a cheap trial only.
  # DIFFERS: the subdomain is not chosen yet. It is a parameter, never a literal elsewhere in this file.
  Subdomain:
    Type: String
    Default: worlds.capxul.com     # the suggestion; not decided
    AllowedPattern: '[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9-]+)+'
  # DIFFERS: a Route 53 zone for the subdomain, so the controller can answer Let's Encrypt DNS challenges.
  # Namecheap has no automation (deploy/ingress/capxul-namecheap-cutover.md). Set "false" if the zone already exists.
  CreateHostedZone:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  # DIFFERS: optional daily Lightsail snapshot of the whole instance. The precedent has none (it relies on backup.py).
  # Off by default because it adds cost (estimate in README.md). It is the Lightsail counterpart of the EBS recovery
  # snapshot described in deploy/openship/README.md.
  AutoSnapshot:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  SnapshotTimeOfDayUtc:
    Type: String
    Default: "04:00"               # after the 03:15 UTC backup timer (deploy/backup/capxul-hosting-backup.timer)
    AllowedPattern: '[0-2][0-9]:00'

Conditions:
  MakeZone: !Equals [!Ref CreateHostedZone, "true"]
  Snapshots: !Equals [!Ref AutoSnapshot, "true"]

Resources:
  Worker:
    Type: AWS::Lightsail::Instance
    DeletionPolicy: Retain         # same
    UpdateReplacePolicy: Retain    # same
    Properties:
      InstanceName: !Ref InstanceName
      AvailabilityZone: !Ref AvailabilityZone
      BlueprintId: !Ref BlueprintId
      BundleId: !Ref BundleId
      KeyPairName: !Ref KeyPairName
      AddOns: !If
        - Snapshots
        - - AddOnType: AutoSnapshot
            Status: Enabled
            AutoSnapshotAddOnRequest:
              SnapshotTimeOfDay: !Ref SnapshotTimeOfDayUtc
        - !Ref AWS::NoValue
      Networking:
        Ports:
          - FromPort: 22
            ToPort: 22
            Protocol: tcp
            AccessDirection: inbound
            AccessType: Public
            Cidrs:
              - !Ref OperatorCidr
              - !Ref ControllerPublicCidr
          # DIFFERS: no port 80. The controller redirects HTTP itself and issues certificates by DNS challenge, so the
          # precedent's ACME-over-HTTP path to the worker is not needed. Only 443 from the controller is open.
          - FromPort: 443
            ToPort: 443
            Protocol: tcp
            AccessDirection: inbound
            AccessType: Public
            Cidrs:
              - !Ref ControllerPublicCidr
      UserData: !Sub |
        #!/bin/sh
        set -eu
        install -d -m 700 /root/.ssh
        printf '%s' '${SshPublicKeyBase64}' | base64 -d >> /root/.ssh/authorized_keys
        printf '\n' >> /root/.ssh/authorized_keys
        chmod 600 /root/.ssh/authorized_keys
        # DIFFERS: container logs are capped before Docker first starts. A bench with many sites logs a lot and the
        # precedent leaves the default (unbounded json-file) in place.
        install -d -m 755 /etc/docker
        printf '{"log-driver":"json-file","log-opts":{"max-size":"20m","max-file":"5"}}\n' > /etc/docker/daemon.json
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose-v2
        systemctl enable --now docker
        # DIFFERS: the cloud's data convention (/srv/capxul/volumes, /etc/capxul/env) is created here, not by a later script.
        install -d -m 755 /srv/capxul/volumes /srv/capxul/sites-host
        install -d -m 700 /etc/capxul/env/sites
        # DIFFERS: 4 GiB swap so a migration spike slows the machine instead of killing MariaDB. The controller does the same
        # (deploy/openship/install-controller.sh); the tools worker does not.
        if ! swapon --show --noheadings | grep -q .; then
          fallocate -l 4G /sites-swap
          chmod 600 /sites-swap
          mkswap /sites-swap >/dev/null
          swapon /sites-swap
          grep -q '^/sites-swap ' /etc/fstab || echo '/sites-swap none swap sw 0 0' >> /etc/fstab
        fi
        printf 'PermitRootLogin prohibit-password\nPasswordAuthentication no\n' > /etc/ssh/sshd_config.d/00-sites-worker.conf
        install -d -m 755 /run/sshd
        sshd -t
        systemctl reload-or-restart ssh
      Tags:
        - Key: Role
          Value: company-sites-worker   # DIFFERS only in value; the precedent uses shared-tools-worker
  StaticIp:
    Type: AWS::Lightsail::StaticIp
    DeletionPolicy: Retain         # same
    UpdateReplacePolicy: Retain
    Properties:
      StaticIpName: !Ref StaticIpName
      AttachedTo: !Ref Worker

  # DIFFERS: everything below is new. The precedent creates no DNS.
  Zone:
    Type: AWS::Route53::HostedZone
    Condition: MakeZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Ref Subdomain
      HostedZoneConfig:
        Comment: Company sites. Delegated from Namecheap by NS records; see sites-host/README.md.
      HostedZoneTags:
        - Key: Role
          Value: company-sites-worker
  # Names under the subdomain resolve to the CONTROLLER (the one front door), never to this machine.
  # One label only: sites are named <company>-<world>.<subdomain>, so a single wildcard covers every world for ever
  # (see ingress.md, "Naming"). A <company>.<world>.<subdomain> form would need one more wildcard record and one
  # more certificate per world.
  Records:
    Type: AWS::Route53::RecordSetGroup
    Condition: MakeZone
    Properties:
      HostedZoneId: !Ref Zone
      RecordSets:
        - Name: !Sub "*.${Subdomain}"
          Type: A
          TTL: "300"
          ResourceRecords: [!Select [0, !Split ["/", !Ref ControllerPublicCidr]]]
        - Name: !Ref Subdomain
          Type: A
          TTL: "300"
          ResourceRecords: [!Select [0, !Split ["/", !Ref ControllerPublicCidr]]]

Outputs:
  WorkerName:
    Value: !Ref Worker
  WorkerPublicIp:
    Value: !GetAtt StaticIp.IpAddress
  ZoneId:
    Condition: MakeZone
    Value: !Ref Zone
  ZoneNameServers:                 # the four values Aaron adds at Namecheap as NS records for the subdomain
    Condition: MakeZone
    Value: !Join [",", !GetAtt Zone.NameServers]
