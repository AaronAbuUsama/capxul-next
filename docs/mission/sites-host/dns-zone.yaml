AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The DNS zone for Capxul worlds (worlds.capxul.com). Created on its own, before the sites machine, so the
  delegation records can be added at Namecheap early. The machine's stack uses this zone and does not create one.
Parameters:
  Subdomain:
    Type: String
    Default: worlds.capxul.com
Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref Subdomain
      HostedZoneConfig:
        Comment: Capxul worlds. One catch-all certificate is issued through this zone.
      HostedZoneTags:
        - Key: Project
          Value: capxul-worlds
Outputs:
  ZoneId:
    Value: !Ref Zone
  NameServers:
    Value: !Join [",", !GetAtt Zone.NameServers]
