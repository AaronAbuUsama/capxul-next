<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 800" role="img" font-family="Inter, system-ui, sans-serif" font-size="14">
  <title>Run observability: the processes and who owns a run's storage</title>
  <desc>A browser reaches the portal server over the tailnet. The portal server serves the generated pages and passes /runs/ through to the host. The host plays the runs, is the only writer of each live run's storage, and accepts clients: the browser through the portal, and terminals directly. Storage is one folder per run.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6270"/></marker>
  </defs>
  <rect width="680" height="800" fill="#FFFFFF"/>

  <!-- clients -->
  <rect x="20" y="20" width="300" height="78" rx="10" fill="#F5F6F8" stroke="#C9CDD6"/>
  <text x="36" y="48" font-weight="600" fill="#14161A">Your phone or laptop</text>
  <text x="36" y="70" fill="#5B6270" font-size="13">a browser: the portal, the Runs pages</text>
  <text x="36" y="88" fill="#5B6270" font-size="13">holds nothing; reopening loses nothing</text>

  <rect x="360" y="20" width="300" height="78" rx="10" fill="#F5F6F8" stroke="#C9CDD6"/>
  <text x="376" y="48" font-weight="600" fill="#14161A">A terminal on this machine</text>
  <text x="376" y="70" fill="#5B6270" font-size="13" font-family="JetBrains Mono, ui-monospace, monospace">loop run · watch · send · stop</text>
  <text x="376" y="88" fill="#5B6270" font-size="13">clients, exactly like the page</text>

  <line x1="170" y1="98" x2="170" y2="176" stroke="#5B6270" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="182" y="128" fill="#14161A" font-size="13">HTTPS, tailnet only</text>
  <text x="182" y="146" fill="#5B6270" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">macbook.tail4b9a40.ts.net:8443</text>
  <text x="182" y="163" fill="#5B6270" font-size="12">nothing is public</text>

  <!-- portal server -->
  <rect x="20" y="178" width="300" height="118" rx="10" fill="#F5F6F8" stroke="#C9CDD6"/>
  <text x="36" y="206" font-weight="600" fill="#14161A">Portal server</text>
  <text x="150" y="206" fill="#5B6270" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">127.0.0.1:4391</text>
  <text x="36" y="230" fill="#5B6270" font-size="13">generated pages: Plan, tasks, Questions</text>
  <text x="36" y="250" fill="#5B6270" font-size="13">saves your answers</text>
  <text x="36" y="270" fill="#5B6270" font-size="13">passes /runs/ through, changes nothing</text>
  <text x="36" y="288" fill="#5B6270" font-size="13">owns no run</text>

  <line x1="170" y1="296" x2="170" y2="368" stroke="#5B6270" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="182" y="328" fill="#14161A" font-size="13">/runs/ and its WebSocket</text>
  <text x="182" y="346" fill="#5B6270" font-size="12">this machine only</text>

  <path d="M510 98 L510 334 L440 368" fill="none" stroke="#5B6270" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="522" y="222" fill="#14161A" font-size="13">WebSocket,</text>
  <text x="522" y="240" fill="#14161A" font-size="13">this machine</text>

  <!-- host -->
  <rect x="20" y="370" width="640" height="150" rx="10" fill="#EEF2FE" stroke="#2447D8" stroke-width="2"/>
  <text x="36" y="400" font-weight="600" fill="#14161A" font-size="16">The host</text>
  <text x="112" y="400" fill="#2447D8" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">pnpm loop serve · 127.0.0.1:4392</text>
  <text x="36" y="426" fill="#14161A" font-size="13">plays every run: the script, its steps, its agents</text>
  <text x="36" y="446" fill="#14161A" font-size="13">the only writer of each live run's storage</text>
  <text x="36" y="466" fill="#14161A" font-size="13">serves the Runs pages and accepts clients; each client gets the current view, then changes</text>
  <text x="36" y="486" fill="#14161A" font-size="13">takes input from any client (steer, queue, stop) and applies it itself</text>
  <text x="36" y="506" fill="#5B6270" font-size="13">scrubs secrets from everything it shows; never from what it stores</text>

  <line x1="170" y1="520" x2="170" y2="594" stroke="#2447D8" stroke-width="2" marker-end="url(#a)"/>
  <text x="182" y="548" fill="#14161A" font-size="13">live run: reads and writes</text>
  <text x="182" y="566" fill="#5B6270" font-size="13">finished run: opens read-only</text>

  <line x1="520" y1="520" x2="520" y2="594" stroke="#5B6270" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="532" y="548" fill="#14161A" font-size="13">model calls</text>
  <text x="532" y="566" fill="#5B6270" font-size="12">key stays here</text>

  <!-- storage -->
  <rect x="20" y="596" width="400" height="150" rx="10" fill="#FFFFFF" stroke="#C9CDD6"/>
  <text x="36" y="624" font-weight="600" fill="#14161A">One folder per run</text>
  <text x="180" y="624" fill="#5B6270" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">var/runs/&lt;run&gt;/</text>
  <text x="36" y="650" fill="#14161A" font-size="13" font-family="JetBrains Mono, ui-monospace, monospace">run.sqlite</text>
  <text x="130" y="650" fill="#5B6270" font-size="13">the steps and every conversation,</text>
  <text x="130" y="668" fill="#5B6270" font-size="13">raw and whole: kept as training data</text>
  <text x="36" y="694" fill="#14161A" font-size="13" font-family="JetBrains Mono, ui-monospace, monospace">status.json</text>
  <text x="130" y="694" fill="#5B6270" font-size="13">a small index, for listing</text>
  <text x="36" y="720" fill="#14161A" font-size="13" font-family="JetBrains Mono, ui-monospace, monospace">lane/</text>
  <text x="130" y="720" fill="#5B6270" font-size="13">the git worktree the agents work in</text>
  <text x="36" y="738" fill="#5B6270" font-size="12">unchanged from today: old runs open</text>

  <rect x="440" y="596" width="220" height="78" rx="10" fill="#F5F6F8" stroke="#C9CDD6"/>
  <text x="456" y="624" font-weight="600" fill="#14161A">Model gateway</text>
  <text x="456" y="646" fill="#5B6270" font-size="12" font-family="JetBrains Mono, ui-monospace, monospace">llm.capxul.com</text>
  <text x="456" y="664" fill="#5B6270" font-size="13">gpt-6.1-sol, gpt-6.1-terra</text>

  <rect x="20" y="766" width="14" height="14" rx="3" fill="#EEF2FE" stroke="#2447D8" stroke-width="2"/>
  <text x="42" y="778" fill="#5B6270" font-size="12">blue: the one process that owns runs. Everything else is a client or a file.</text>
</svg>
