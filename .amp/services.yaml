# Amp orb services (https://ampcode.com/docs/orbs/portals). The live book follows landed wave-zero slices
# without switching the serving checkout. It is read-only and never saves Questions answers.
services:
  capxul-stack:
    command: packages/devnet/orb/serve.sh
    platforms: [linux]
    port: 8000
  book:
    command: PORTAL_ALLOW_HOSTS="$(echo "$PUBLIC_URL" | sed -E 's#^https?://##; s#/.*$##')" pnpm portal:serve --live --port "$PORT"
    health: /
    review: false
    platforms: [linux]
    portal:
      url: /board/
      title: The book
      description: Live wave-zero slices and blueprint evidence. Read-only; Questions answers are not accepted.
